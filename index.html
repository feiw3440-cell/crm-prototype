/* ===== 第 6 阶段：公海规则配置 /system/pool-rules（线索公海 / 客户公海 + 规则试算 + 变更记录） ===== */
const PR_KEY = 'crm_pool_rules_v1';
const PR_DEFAULT = {
  leads: { noFollow: 15, noDeal: 45, protectKey: false, protectContract: false, dailyLimit: 5, holdLimit: 20, protectDays: 15, needAudit: false, alloc: '手动', scope: [] },
  custs: { noFollow: 15, noDeal: 90, protectKey: true, protectContract: true, dailyLimit: 5, holdLimit: 30, protectDays: 30, needAudit: true, alloc: '手动', scope: [] },
  logs: [ { time: '2026-10-12 10:20', who: '管理员', desc: '初始化公海规则：客户公海 15 天未跟进 / 90 天未成交自动释放，重点客户与履约合同客户保护。' } ],
};
const prDeep = o => JSON.parse(JSON.stringify(o));
function prRead() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PR_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return prDeep(PR_DEFAULT);
  const out = prDeep(PR_DEFAULT);
  ['leads', 'custs'].forEach(k => { if (saved[k]) out[k] = Object.assign(out[k], saved[k]); });
  if (Array.isArray(saved.logs)) out.logs = saved.logs;
  return out;
}
const prHasContract = c => (store.ext.contracts || []).some(t => t.customer === c.name && (t.status === '履约中' || t.status === '已签署'));

const PoolRulesPage = {
  components: { PageHead },
  setup() {
    const r = reactive(prRead());
    const active = ref('custs');
    const trial = reactive({ show: '', rows: [], kept: [], note: '' });
    const todayStr = TODAY;
    const diff = (a, b) => daysBetween(a, b);

    const stats = computed(() => {
      const poolCust = store.customers.filter(c => !c.owner).length;
      const poolLead = store.leads.filter(l => !l.owner && l.status !== '已转化').length;
      const protectCust = store.customers.filter(c => c.owner && (c.key || prHasContract(c))).length;
      return [['公海客户（无负责人）', String(poolCust), 'warn'], ['公海线索（无负责人）', String(poolLead), 'warn'],
        ['受保护客户', String(protectCust), 'ok'], ['规则变更记录', String(r.logs.length), '']];
    });
    const SRC_OPTS = ['官网', '广告', '活动', '转介绍', '渠道'];
    const LVL_OPTS = ['战略客户', '重点客户', '普通客户', '潜在客户'];
    const ALLOCS = ['手动', '轮流', '按区域'];

    const save = () => {
      try { localStorage.setItem(PR_KEY, JSON.stringify({ leads: r.leads, custs: r.custs, logs: r.logs })); } catch (e) {}
      ElMessage.success('公海规则已保存（本地持久化，刷新后仍生效）');
    };
    const saveLogs = () => {
      const d = active.value === 'custs' ? '客户公海' : '线索公海';
      r.logs.unshift({ time: todayStr + ' ' + String(new Date().getHours()).padStart(2, '0') + ':' + String(new Date().getMinutes()).padStart(2, '0'), who: '管理员', desc: '调整' + d + '规则：未跟进 ' + (active.value === 'custs' ? r.custs.noFollow : r.leads.noFollow) + ' 天 / 未成交 ' + (active.value === 'custs' ? r.custs.noDeal : r.leads.noDeal) + ' 天，保护期 ' + (active.value === 'custs' ? r.custs.protectDays : r.leads.protectDays) + ' 天，分配方式：' + (active.value === 'custs' ? r.custs.alloc : r.leads.alloc) + '。' });
      if (r.logs.length > 30) r.logs.length = 30;
      save(); ElMessage.success('规则已保存，并已写入变更记录');
    };
    const reset = () => {
      ElMessageBox.confirm('恢复本次公海规则的默认配置？', '恢复默认', { type: 'warning', confirmButtonText: '恢复', cancelButtonText: '取消' })
        .then(() => { Object.assign(r, prDeep(PR_DEFAULT)); save(); ElMessage.success('已恢复默认规则'); }).catch(() => {});
    };

    const runTrial = which => {
      active.value = which;
      const rule = which === 'custs' ? r.custs : r.leads;
      const rows = [], kept = [];
      if (which === 'custs') {
        store.customers.forEach(c => {
          if (c.status === '流失' || (c.mergedTo !== undefined)) return;
          const inScope = !rule.scope.length || rule.scope.includes(c.level);
          const dFollow = diff(c.lastFollow, todayStr);
          const dDeal = c.lastDeal && c.lastDeal !== '-' ? diff(c.lastDeal, todayStr) : diff(c.created, todayStr);
          if (!c.owner) {
            kept.push({ n: c.name, w: '—（已在公海）', why: c.status === '潜在客户' ? '潜在客户尚未分配' : '公海存量' });
            return;
          }
          if (c.key && rule.protectKey) {
            kept.push({ n: c.name, w: c.owner, why: '重点客户保护开启' });
            return;
          }
          if (rule.protectContract && prHasContract(c)) return kept.push({ n: c.name, w: c.owner, why: '名下有履约中/已签署合同（保护）' });
          if (!inScope) {
            kept.push({ n: c.name, w: c.owner, why: '生效范围未覆盖「' + c.level + '」' });
            return;
          }
          const reasons = [];
          if (dFollow >= rule.noFollow) reasons.push('超 ' + rule.noFollow + ' 天未跟进（最后跟进 ' + (c.lastFollow || '—') + '）');
          if (dDeal >= rule.noDeal) reasons.push('超 ' + rule.noDeal + ' 天未成交（' + (c.lastDeal !== '-' ? '最近成交 ' + c.lastDeal : '从未成交') + '）');
          if (reasons.length) rows.push({ n: c.name, w: c.owner, why: reasons.join('；') });
          else kept.push({ n: c.name, w: c.owner, why: '持续跟进中，不触发释放' });
        });
      } else {
        store.leads.forEach(l => {
          if (l.status === '已转化' || l.status === '无效') {
            kept.push({ n: l.no + ' ' + l.company, w: l.owner || '—', why: '状态为「' + l.status + '」，不参与释放' });
            return;
          }
          const base = (l.created || '').slice(0, 10);
          const d = diff(base, todayStr);
          const inScope = !rule.scope.length || rule.scope.includes(l.source);
          if (!l.owner) {
            kept.push({ n: l.no + ' ' + l.company, w: '—（公海）', why: '待领取' });
            return;
          }
          if (!inScope) return kept.push({ n: l.no + ' ' + l.company, w: l.owner, why: '生效范围未覆盖来源「' + l.source + '」' });
          if (d >= rule.noFollow) rows.push({ n: l.no + ' ' + l.company, w: l.owner, why: '创建后超 ' + rule.noFollow + ' 天未跟进（' + base + '）' });
          else kept.push({ n: l.no + ' ' + l.company, w: l.owner, why: d >= 0 ? '跟进窗口内（' + d + ' 天）' : '新增线索' });
        });
      }
      trial.rows = rows; trial.kept = kept; trial.show = which;
      trial.note = which === 'custs'
        ? '试算口径：对 store.customers 中全部在档客户按当前规则模拟释放（不写数据）。重点客户保护 / 履约合同保护优先生效。'
        : '试算口径：对 store.leads 中全部线索按当前规则模拟释放（不写数据）；已转化 / 无效线索不参与。';
      ElMessage.success('试算完成：将释放 ' + rows.length + ' 条、受保护/不触发 ' + kept.length + ' 条');
    };

    return { r, active, trial, save, saveLogs, reset, runTrial, stats, SRC_OPTS, LVL_OPTS, ALLOCS, trialPane: computed(() => trial.show === 'custs' ? '客户公海' : '线索公海') };
  },
  template: `<div>
    <page-head :crumbs="['系统管理','公海规则']" title="公海规则配置" :total="'线索公海 / 客户公海 · 规则离线持久化'">
      <el-button icon="RefreshLeft" @click="reset">恢复默认</el-button>
    </page-head>
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card" v-for="s in stats" :key="s[0]" :class="s[2]"><span class="lb">{{ s[0] }}</span><span class="vl">{{ s[1] }}</span><span class="ft">试算与限额实时核对</span></div>
    </div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start">
      <div class="card card-pad" v-for="(pool,key) in {leads:'线索公海',custs:'客户公海'}" :key="key" :style="active===key ? 'border-color:var(--el-color-primary)' : ''">
        <div class="card-title" style="justify-content:space-between">
          <span><el-icon style="color:var(--el-color-primary);margin-right:6px"><bucket/></el-icon>{{ pool }}规则</span>
          <el-tag size="small" effect="plain">生效范围：{{ r[key].scope.length ? (key==='custs' ? r[key].scope.join(' / ') : r[key].scope.join(' / ')) : '全部（不限）' }}</el-tag>
        </div>
        <el-form label-width="150px" style="margin-top:4px">
          <el-form-item label="自动释放条件">
            <div style="display:flex;flex-direction:column;gap:8px;width:100%">
              <div style="display:flex;align-items:center;gap:8px">超 <el-input-number v-model="r[key].noFollow" :min="1" :max="365" size="small" style="width:100px"/> 天未跟进</div>
              <div style="display:flex;align-items:center;gap:8px">超 <el-input-number v-model="r[key].noDeal" :min="1" :max="365" size="small" style="width:100px"/> 天未成交</div>
            </div>
          </el-form-item>
          <el-form-item label="客户保护">
            <div style="display:flex;flex-direction:column;gap:6px">
              <el-checkbox v-model="r[key].protectKey">重点客户（战略/重点等级）保护，不自动释放</el-checkbox>
              <el-checkbox v-model="r[key].protectContract">有履约中 / 已签署合同的客户保护</el-checkbox>
            </div>
          </el-form-item>
          <el-form-item label="领取限制">
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">

/* ===== 第 3 阶段：产品目录 /products + 产品详情 /product/:no + 价格表 /pricebooks ===== */
const PRODUCT_CATS = ['软件', '服务', '实施费用', '维护费用', '增值服务', '套餐'];
const PRODUCT_STS = ['在售', '停售', '停用'];
const PRODUCT_STATUS_TAG = { 在售: 'success', 停售: 'warning', 停用: 'info' };
const genProductNo = () => {
  let seq = store.ext.products.length + 100; let no;
  do { no = 'CP-' + String(seq++).padStart(4, '0'); } while (store.ext.products.some(p => p.no === no));
  return no;
};

/* ----- 产品目录（真写入 store.ext.products） ----- */
const ProductsPage = {
  components: { ListPage },
  setup() {
    const rows = computed(() => store.ext.products);
    const stats = computed(() => {
      const a = store.ext.products;
      return [['产品总数', String(a.length), '', PRODUCT_CATS.length + ' 个分类'], ['在售', String(a.filter(p => p.status === '在售').length), 'ok'], ['停售 / 停用', String(a.filter(p => p.status !== '在售').length), 'warn'], ['价格表', String(store.ext.pricebooks.length), '']];
    });
    const cols = [
      { p: 'no', l: '产品编号', w: 110 }, { p: 'name', l: '产品名称', w: 200, link: true }, { p: 'cat', l: '产品分类', w: 100 },
      { p: 'spec', l: '产品规格', w: 150 }, { p: 'unit', l: '标准单位', w: 95 }, { p: 'price', l: '标准售价', w: 115, money: true },
      { p: 'cost', l: '成本价', w: 110, money: true }, { p: 'status', l: '产品状态', w: 95, tag: PRODUCT_STATUS_TAG }, { p: 'desc', l: '产品说明', w: 220 },
    ];
    const filters = [
      { k: 'kw', label: '搜索产品', ph: '产品编号 / 名称 / 说明' }, { k: 'cat', label: '产品分类', opts: PRODUCT_CATS }, { k: 'status', label: '产品状态', opts: PRODUCT_STS },
    ];
    /* ---- 新增 / 编辑 / 停售 ---- */
    const fref = ref(null);
    const dlg = reactive({ open: false, edit: null });
    const f = reactive({});
    const rule = {
      name: [{ required: true, message: '请填写产品名称', trigger: 'blur' }],
      cat: [{ required: true, message: '请选择产品分类', trigger: 'change' }],
      price: [{ required: true, message: '请填写标准售价', trigger: 'blur' }, { type: 'number', min: 0.01, message: '售价必须大于 0', trigger: 'blur' }],
      cost: [{ type: 'number', min: 0, message: '成本价不能为负数', trigger: 'blur' }],
    };
    const openAdd = () => { dlg.edit = null; Object.assign(f, { no: '', name: '', cat: '软件', spec: '', unit: '套', price: null, cost: null, status: '在售', desc: '' }); dlg.open = true; nextTick(() => fref.value && fref.value.clearValidate()); };
    const openEdit = row => { dlg.edit = store.ext.products.find(x => x.no === row.no) || row; Object.keys(f).forEach(k => delete f[k]); Object.assign(f, dlg.edit); dlg.open = true; nextTick(() => fref.value && fref.value.clearValidate()); };
    const save = () => fref.value.validate(ok => {
      if (!ok) return;
      const data = { name: f.name, cat: f.cat, spec: f.spec, unit: f.unit, price: f.price, cost: f.cost || 0, status: f.status, desc: f.desc };
      if (dlg.edit) { Object.assign(dlg.edit, data); store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '编辑', detail: `编辑产品「${f.name}」（${dlg.edit.no}）` }); ElMessage.success('产品已保存，目录与价格表明细即时同步'); }
      else {
        const no = genProductNo(); const p = { no, ...data };
        store.ext.products.push(p);
        store.ext.pricebooks.forEach(b => b.items.push({ productNo: no, price: data.price, minDiscount: b.type === '渠道价' ? 80 : 85 }));
        store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '新建', detail: `新建产品「${f.name}」（${no}），已同步到全部价格表` });
        ElMessage.success('产品已新增并同步到全部价格表');
      }
      dlg.open = false;
    });
    const toggleSale = row => {
      const goOut = row.status === '在售';
      ElMessageBox.confirm(`确认将产品「${row.name}」${goOut ? '停售' : '恢复在售'}？${goOut ? '停售后不能再加入新报价，历史报价不受影响。' : '恢复后可正常用于报价。'}`, goOut ? '停售确认' : '恢复在售', { type: 'warning' }).then(() => {
        row.status = goOut ? '停售' : '在售';
        store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '编辑', detail: `产品「${row.name}」（${row.no}）状态变更为：${row.status}` });
        ElMessage.success(`已${goOut ? '停售' : '恢复在售'}：${row.name}`);
      }).catch(() => {});
    };
    return { rows, stats, cols, filters, dlg, f, fref, rule, openAdd, openEdit, save, toggleSale, PRODUCT_CATS, PRODUCT_STS, store, fmtY, fmtC };
  },
  template: `<div>
    <list-page :crumbs="['产品管理','产品目录']" title="产品目录" :stats="stats" :filters="filters" :rows="rows" :cols="cols" :action-width="170"
      @link="(c,row) => $go('/product/'+row.no)">
      <template #ops><el-button type="primary" icon="Plus" @click="openAdd">新增产品</el-button><el-button icon="Tickets" @click="$go('/pricebooks')">价格表管理</el-button><el-button icon="Upload" @click="$msg.info('示例：导入产品')">导入</el-button></template>
      <template #actions="{row,open}">
        <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
        <el-button link type="primary" @click="$go('/product/'+row.no)">详情</el-button>
        <el-button v-if="row.status==='在售'" link type="danger" @click="toggleSale(row)">停售</el-button>
        <el-button v-else link type="success" @click="toggleSale(row)">恢复</el-button>
      </template>
    </list-page>
    <el-dialog v-model="dlg.open" :title="dlg.edit ? '编辑产品 · ' + (dlg.edit.name||'') : '新增产品'" width="560px">
      <el-form ref="fref" :model="f" :rules="rule" label-width="96px">
        <el-form-item label="产品名称" prop="name"><el-input v-model="f.name"/></el-form-item>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="产品分类" prop="cat"><el-select v-model="f.cat" style="width:100%"><el-option v-for="x in PRODUCT_CATS" :key="x" :label="x" :value="x"/></el-select></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="产品状态"><el-select v-model="f.status" style="width:100%"><el-option v-for="x in PRODUCT_STS" :key="x" :label="x" :value="x"/></el-select></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="产品规格"><el-input v-model="f.spec" placeholder="如 50 用户 · 年付"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="标准单位"><el-input v-model="f.unit" placeholder="如 套 / 人天 / 年"/></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="标准售价" prop="price"><el-input-number v-model="f.price" :min="0.01" :step="100" :controls="false" style="width:100%" placeholder="元"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="成本价" prop="cost"><el-input-number v-model="f.cost" :min="0" :step="100" :controls="false" style="width:100%" placeholder="元"/></el-form-item></el-col>
        </el-row>
        <el-form-item label="产品说明"><el-input type="textarea" :rows="2" v-model="f.desc"/></el-form-item>
      </el-form>
      <el-alert type="info" show-icon :closable="false" :title="'保存后写入产品目录；新增产品会自动同步到全部 ' + store.ext.pricebooks.length + ' 张价格表'"/>
      <template #footer><el-button @click="dlg.open=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
    </el-dialog>
  </div>`,
};
registerRoute('/products', ProductsPage, 'products');

/* ----- 产品详情：各价格表价格 + 引用产品的报价 ----- */
const ProductDetail = {
  components: { PageHead },
  props: { no: String },
  setup(props) {
    const p = computed(() => store.ext.products.find(x => x.no === props.no) || null);
    const bookRows = computed(() => !p.value ? [] : store.ext.pricebooks.map(b => {
      const it = b.items.find(i => i.productNo === p.value.no) || {};
      return { no: b.no, name: b.name, type: b.type, status: b.status, price: it.price == null ? (p.value.price || 0) : it.price, minDiscount: it.minDiscount == null ? 85 : it.minDiscount, ratio: p.value.price ? Math.round(it.price * 100 / p.value.price) : 100 };
    }));
    const quoteRows = computed(() => !p.value ? [] : store.ext.quotes.filter(q => (q.items || []).some(it => it.productNo === props.no)).map(q => {
      const it = (q.items || []).find(x => x.productNo === props.no);
      return { no: q.no, customer: q.customer, date: q.date, appr: q.appr, qty: it.qty, unit: it.unit, price: it.price, discount: it.discount };
    }));
    const QuoteTag = { 已通过: 'success', 审批中: 'warning', 草稿: 'info', 已驳回: 'danger' };
    return { p, bookRows, quoteRows, QuoteTag, PRODUCT_STATUS_TAG, fmtY, fmtC, store };
  },

    </div>
    <div class="card card-pad" style="margin-bottom:14px"><div class="card-title">各价格表中的价格</div>

        <el-table-column label="最低折扣" width="100" align="center"><template #default="{row}">{{ row.minDiscount }}%</template></el-table-column>

function tkNow() { const n = new Date(); return TODAY + ' ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); }
function tkLog(no, act, detail) { store.ext.logs.unshift({ time: tkNow(), who: '张三', module: '工单', act, detail: detail + '（工单：' + no + '）' }); }
function tkNextNo() { let mx = 99; store.ext.tickets.forEach(x => { const n = Number(String(x.no).split('-')[2]); if (n > mx) mx = n; }); return 'GD-' + TODAY.slice(0, 7).replace('-', '') + '-' + String(mx + 1).padStart(4, '0'); }
function tkSla(t) {
  if (t.status === '已关闭') return { k: 'none', txt: '-' };
  const dead = new Date(String(t.slaDeadline).replace(' ', 'T'));
  const now = new Date(String(tkNow()).replace(' ', 'T'));
  const rem = dead.getTime() - now.getTime();
  if (rem < 0) {
    const hs = Math.round(-rem / 1800000) / 2;
    return { k: 'timeout', txt: '超时 ' + (hs >= 1 ? (hs % 1 ? hs.toFixed(1) : hs) + ' 小时' : Math.round(-rem / 60000) + ' 分钟') };
  }
  const h = Math.floor(rem / 3600000), m = Math.ceil(rem % 3600000 / 60000);
  const txt = (h ? h + ' 小时 ' : '') + (h || m ? m + ' 分' : '不足 1 分钟') + ' 剩余';
  return { k: h <= 1 ? 'soon' : 'ok', txt };
}

      return [['用户总数', String(us.length), ''], ['启用', String(us.filter(u => u.status === '启用').length), 'ok'],
        ['已停用', String(us.filter(u => u.status === '停用').length), 'warn'], ['角色数', String(store.ext.roles.length), '']];
    });
    const uDlg = reactive({ show: false, edit: '' });
    const uForm = reactive({ id: '', acc: '', name: '', dept: '', role: '', phone: '', email: '', status: '启用' });
    const uRules = {
      acc: [{ required: true, message: '请输入账号', trigger: 'blur' }],
      name: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
      dept: [{ required: true, message: '请选择部门', trigger: 'change' }],
      role: [{ required: true, message: '请选择角色', trigger: 'change' }],
    };
    const uRef = ref(null);
    const uOpen = row => {
      Object.assign(uForm, row || { id: '', acc: '', name: '', dept: '', role: '', phone: '', email: '', status: '启用' }, { id: row ? row.id : '', status: row ? row.status : '启用' });
      uDlg.edit = row ? row.id : ''; uDlg.show = true;
    };
    const uSave = () => uRef.value.validate(ok => {
      if (!ok) return;
      const dup = store.ext.users.find(u => u.acc === uForm.acc && u.id !== uForm.id);
      if (dup) return ElMessage.warning('账号「' + uForm.acc + '」已存在（账号需唯一）');
      if (uForm.id) {
        const t = store.ext.users.find(u => u.id === uForm.id);
        Object.assign(t, { acc: uForm.acc, name: uForm.name, dept: uForm.dept, role: uForm.role, phone: uForm.phone, email: uForm.email, status: uForm.status });
        store.ext.logs.unshift({ time: sysNow(), who: '管理员', module: '系统', act: '编辑', detail: '编辑用户「' + uForm.name + '」（账号：' + uForm.acc + '）', ip: '10.20.0.5' });
      } else {
        let n = 1;
        store.ext.users.forEach(u => { const k = Number(String(u.id).slice(1)); if (k >= n) n = k + 1; });
        store.ext.users.push({ id: 'u' + String(n).padStart(2, '0'), acc: uForm.acc, name: uForm.name, dept: uForm.dept, role: uForm.role, phone: uForm.phone, email: uForm.email, status: uForm.status, lastLogin: '—' });
        store.ext.logs.unshift({ time: sysNow(), who: '管理员', module: '系统', act: '新建', detail: '新增用户「' + uForm.name + '」（账号：' + uForm.acc + '，角色：' + uForm.role + '）', ip: '10.20.0.5' });
      }
      uDlg.show = false; ElMessage.success('已保存并写回用户列表');

    const uToggle = row => ElMessageBox.confirm(
      row.status === '启用' ? '停用后「' + row.name + '」将立即失去登录权限，进行中的审批不受影响。' : '启用后该用户恢复登录与数据访问权限。',
      row.status === '启用' ? '停用确认' : '启用确认', { type: 'warning', confirmButtonText: '确认', cancelButtonText: '取消' }).then(() => {
      row.status = row.status === '启用' ? '停用' : '启用';
      store.ext.logs.unshift({ time: sysNow(), who: '管理员', module: '系统', act: row.status === '停用' ? '停用' : '启用', detail: (row.status === '停用' ? '停用' : '启用') + '用户「' + row.name + '」', ip: '10.20.0.5' });
      ElMessage.success('已' + (row.status === '停用' ? '停用' : '启用') + '：' + row.name);
    }).catch(() => {});
    const uDrawer = reactive({ show: false, cur: null });
    const uShow = row => { uDrawer.cur = row; uDrawer.show = true; };
    const uLogs = computed(() => uDrawer.cur ? store.ext.logs.filter(l => l.who === uDrawer.cur.name).slice(0, 6) : []);

    /* ---------- 角色权限 ---------- */
    const roleK = ref('sales');
    const roleTree = ref(null);
    const role = computed(() => store.ext.roles.find(r => r.key === roleK.value) || store.ext.roles[0]);
    const rData = reactive({ desc: '', scope: '', btns: [], masks: [] });
    const roleMenus = ref([]);
    const syncChecked = () => {
      roleMenus.value = [];
      (role.value.menus || []).forEach(k => {
        roleMenus.value.push(k);

          if (n.children && n.children.some(c => c.label === k)) roleMenus.value.push(n.label);

      });
      if (roleTree.value) roleTree.value.setCheckedKeys([...new Set(roleMenus.value)]);
    };
    watch(roleK, () => {
      rData.desc = role.value.desc; rData.scope = role.value.dataScope;
      rData.btns = [...role.value.buttons]; rData.masks = [...role.value.fieldMask];
      nextTick(syncChecked);
    }, { immediate: true });
    const roleSave = () => {
      const ck = [...(roleTree.value ? roleTree.value.getCheckedKeys() : []), ...(roleTree.value ? roleTree.value.getHalfCheckedKeys() : [])];
      const r = role.value;

      r.desc = rData.desc; r.dataScope = rData.scope; r.buttons = [...rData.btns]; r.fieldMask = [...rData.masks];

    };

    /* ---------- 组织架构 ---------- */
    const orgT = computed(() => {
      const nodes = {};
      store.ext.depts.forEach(d => { nodes[d.no] = { label: d.name, no: d.no, count: store.ext.users.filter(u => u.dept === d.name).length, children: [] }; });
      const roots = [];
      store.ext.depts.forEach(d => { if (d.parent && nodes[d.parent]) nodes[d.parent].children.push(nodes[d.no]); else roots.push(nodes[d.no]); });
      return roots;
    });
    const oDlg = ref(false);
    const oForm = reactive({ parent: '某某软件有限公司', name: '' });
    const oSave = () => {
      const name = (oForm.name || '').trim();
      if (!name) return ElMessage.warning('请输入部门名称');
      if (store.ext.depts.some(d => d.name === name)) return ElMessage.warning('部门「' + name + '」已存在');

      let n = 0;
      store.ext.depts.forEach(d => { const k = Number(String(d.no).slice(1)); if (k >= n) n = k + 1; });
      store.ext.depts.push({ no: 'D' + String(n).padStart(2, '0'), name, parent: parent ? parent.no : 'D00' });
      store.ext.logs.unshift({ time: sysNow(), who: '管理员', module: '系统', act: '新建', detail: '新增部门「' + name + '」（上级：' + oForm.parent + '）', ip: '10.20.0.5' });
      oDlg.value = false; oForm.name = '';

    };

    /* ---------- 操作日志 ---------- */
    const lQ = reactive({ kw: '', who: '', module: '' });

    const lPaged = computed(() => lFiltered.value.slice((lPage.value - 1) * lSize.value, lPage.value * lSize.value));
    watch(() => [lQ.kw, lQ.who, lQ.module], () => { lPage.value = 1; });
    const lStats = computed(() => {
      const a = store.ext.logs;

    const actTag = act => ({ 新建: 'success', 编辑: 'primary', 登录: 'info', 作废: 'danger', 回收: 'warning' }[act] || 'warning');

    const crumbs = computed(() => ['系统管理', SYS_PAGES[props.tab] || '用户管理']);
    const tabPath = { users: '/system', roles: '/system/roles', org: '/system/org', logs: '/system/logs' };
    const onTab = t => { if (tabPath[t]) go(tabPath[t]); };
    return { crumbs, tabPath, onTab, SYS_MENU_TREE, SYS_BTN_OPTS, SYS_MASK_OPTS, SYS_DATA_SCOPE, store,
      uQ, uPage, uSize, uDepts, uRoles, uFiltered, uPaged, uStats, uDlg, uForm, uRef, uRules, uOpen, uSave, uToggle, uDrawer, uShow, uLogs, actTag,
      roleK, roleTree, role, rData, roleSave,

      lQ, lPage, lSize, lWho, lMod, lFiltered, lPaged, lStats };

const App = {
  components: { DocPanel },
  setup() {
    const parse = () => { const h = (location.hash || '#/workbench').slice(1); return h || '/workbench'; };
    const path = ref(parse());
    window.addEventListener('hashchange', () => { path.value = parse(); document.querySelector('.main') && (document.querySelector('.main').scrollTop = 0); });
    const view = computed(() => {
      const m = matchRoute(path.value);
      if (m) return { comp: m.comp, props: m.props, docKey: m.docKey };
      return { comp: NotFoundPage, props: {}, docKey: '' };
    });
    watch(view, v => { docState.key = v.docKey; docState.override = ''; }, { immediate: true });
    const active = computed(() => {
      const p = path.value;
      if (p.startsWith('/customer/')) return '/customers';
      if (p.startsWith('/quote/')) return '/quotes';
      if (p.startsWith('/lead/')) return '/leads/my';
      if (p.startsWith('/opp/')) return '/opps/list';
      if (p.startsWith('/analytics/')) return '/analytics';
      if (p.startsWith('/system/user/')) return '/system';
      if (p.startsWith('/approvals/')) return '/approvals/templates';
      return p;
    });
    const menu = ref(null);
    const opened = computed(() => { const n = NAV.find(n => n.children && n.children.some(c => c.path === active.value)); return n ? [n.key] : []; });
    watch(opened, v => { v.length && menu.value && menu.value.open(v[0]); });
    // 全局搜索
    const kw = ref('');
    const searchFn = (q, cb) => {
      if (!q) return cb([]);
      const r = [];
      store.customers.forEach(c => { if (c.name.includes(q) || c.no.includes(q)) r.push({ value: c.name, tag: '客户', to: '/customer/' + c.no }); });
      store.leads.forEach(l => { if (l.company.includes(q) || l.no.includes(q) || l.contact.includes(q)) r.push({ value: l.company + '（' + l.no + '）', tag: '线索', to: '/lead/' + l.no }); });
      store.opps.forEach(o => { if (o.name.includes(q) || o.no.includes(q)) r.push({ value: o.name, tag: '商机', to: '/opp/' + o.no }); });
      PH.contacts.rows.forEach(c => { if (c.name.includes(q)) r.push({ value: c.name + ' · ' + c.customer, tag: '联系人', to: '/contacts' }); });
      cb(r.slice(0, 8));
    };
    const selectSearch = it => { go(it.to); kw.value = ''; };
    const unread = computed(() => store.messages.filter(m => !m.read).length);
    const todoCount = computed(() => store.approvals.filter(a => a.tab === 'todo').length + 8);
    const readAll = () => store.messages.forEach(m => m.read = true);
    return { path, view, active, menu, opened, NAV, kw, searchFn, selectSearch, unread, todoCount, store, go, readAll, THEMES, theme, applyTheme };
  },
  template: `<div class="layout">
    <div class="topbar">
