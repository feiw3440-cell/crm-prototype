<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业级 CRM 系统 · 高保真原型</title>
<link rel="stylesheet" href="lib/element-plus.css">
<style>
/* ================= 主题变量（默认天蓝 sky；可切 pink / white / gray） ================= */
:root, html[data-theme="sky"]{
  --el-color-primary:#2f9bff;
  --el-color-primary-light-3:#68b5ff;
  --el-color-primary-light-5:#94c9ff;
  --el-color-primary-light-7:#c3e0ff;
  --el-color-primary-light-8:#d9ecff;
  --el-color-primary-light-9:#eef7ff;
  --el-color-primary-dark-2:#247acc;
  --navy:#0d2b52; --navy2:#16407d; --navy3:#0a2040; --sidebar-text:#b5cced; --brand-text:#fff;
  --bg:#eef5fd; --card:#fff; --line:#dfe9f5; --text:#1d2a3d; --sub:#67768f;
  --soft:#f6faff; --tint:#e2edfb; --headbg:#f3f8fe; --headtex:#43536f;
  --ok:#2e9e6a; --warn:#e6a23c; --danger:#d9534f; --danger2:#c0392b;
  --el-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
}
html[data-theme="pink"]{
  --el-color-primary:#e8588d;
  --el-color-primary-light-3:#ee85ac;
  --el-color-primary-light-5:#f3a8c4;
  --el-color-primary-light-7:#f9cee0;
  --el-color-primary-light-8:#fce0eb;
  --el-color-primary-light-9:#fef0f6;
  --el-color-primary-dark-2:#c24374;
  --navy:#8f2350; --navy2:#ad3d6e; --navy3:#76173d; --sidebar-text:#f2ccdd; --brand-text:#fff;
  --bg:#fdf3f8; --card:#fff; --line:#f3dde7; --text:#41293a; --sub:#9c7a8a;
  --soft:#fdf8fb; --tint:#f8e2ec; --headbg:#fdf4f9; --headtex:#7c5566;
  --ok:#2e9e6a; --warn:#e6a23c; --danger:#d9534f; --danger2:#c0392b;
}
html[data-theme="white"]{
  --el-color-primary:#2b3a55;
  --el-color-primary-light-3:#5a6780;
  --el-color-primary-light-5:#828da0;
  --el-color-primary-light-7:#aab2c0;
  --el-color-primary-light-8:#c5cbd5;
  --el-color-primary-light-9:#eaeef2;
  --el-color-primary-dark-2:#232f47;
  --navy:#ffffff; --navy2:#f1f3f6; --navy3:#f7f9fb; --sidebar-text:#45536e; --brand-text:#2b3a55;
  --bg:#f6f7f9; --card:#fff; --line:#e7eaee; --text:#242b38; --sub:#6a7484;
  --soft:#fafbfc; --tint:#eef1f5; --headbg:#f4f6f8; --headtex:#4a5568;
  --ok:#2e9e6a; --warn:#e6a23c; --danger:#d9534f; --danger2:#c0392b;
}
html[data-theme="gray"]{
  --el-color-primary:#5b6b7f;
  --el-color-primary-light-3:#7d8898;
  --el-color-primary-light-5:#9ca7b5;
  --el-color-primary-light-7:#bec7cf;
  --el-color-primary-light-8:#d1d8de;
  --el-color-primary-light-9:#eef1f3;
  --el-color-primary-dark-2:#495666;
  --navy:#22272e; --navy2:#343b44; --navy3:#191d23; --sidebar-text:#a9b2bd; --brand-text:#fff;
  --bg:#eff0f2; --card:#fff; --line:#e0e3e7; --text:#24292f; --sub:#667080;
  --soft:#f7f8f9; --tint:#e6e9ec; --headbg:#f4f5f6; --headtex:#57606a;
  --ok:#2e9e6a; --warn:#e6a23c; --danger:#d9534f; --danger2:#c0392b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--el-font-family);font-size:14px}
#app{height:100%}
a{color:var(--el-color-primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.layout{display:flex;flex-direction:column;height:100vh;min-width:1200px}
.topbar{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px 0 0;gap:16px;z-index:10}
.brand{width:220px;height:56px;background:var(--navy);color:var(--brand-text);display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:600;font-size:16px;letter-spacing:.5px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--el-color-primary-light-3),var(--el-color-primary-dark-2));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
.top-search{width:360px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:19px;position:relative}
.icon-btn:hover{background:var(--el-color-primary-light-9);color:var(--el-color-primary)}
.icon-btn .el-badge{position:absolute;top:2px;right:0}
.theme-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:-2px;border:1px solid var(--line)}
.user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:8px;margin-left:6px}
.user-chip:hover{background:var(--el-color-primary-light-9)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--el-color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:220px;flex:none;background:var(--navy);overflow-y:auto;padding-bottom:12px}
.sidebar::-webkit-scrollbar{width:0}
.sidebar .el-menu{background:transparent;border-right:0}
.sidebar .el-menu-item,.sidebar .el-sub-menu__title{height:40px;line-height:40px;color:var(--sidebar-text);font-size:14px}
.sidebar .el-menu-item:hover,.sidebar .el-sub-menu__title:hover{background:var(--navy2);color:var(--brand-text)}
.sidebar .el-menu-item.is-active{background:var(--el-color-primary);color:#fff}
.sidebar .el-sub-menu.is-active>.el-sub-menu__title{color:var(--brand-text)}
.sidebar .el-sub-menu .el-menu{background:var(--navy3)}
.sidebar .el-sub-menu .el-menu-item{height:36px;line-height:36px;padding-left:52px!important;font-size:13px}
.sidebar .el-icon{color:inherit}
.main{flex:1;overflow:auto;padding:16px 24px 28px;min-width:0}
.crumb{margin-bottom:8px}
.page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.page-head h1{margin:0;font-size:20px;font-weight:600;white-space:nowrap}
.page-head .total{color:var(--sub);font-size:14px}
.page-head .head-ops{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card-pad{padding:16px 18px}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title .more{margin-left:auto;font-weight:400;font-size:13px}
.stat-row{display:grid;gap:14px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.stat-card .lb{color:var(--sub);font-size:13px}
.stat-card .vl{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .ft{color:var(--sub);font-size:12px}
.stat-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el-color-primary)}
.stat-card.warn:before{background:var(--warn)}.stat-card.danger:before{background:var(--danger)}.stat-card.ok:before{background:var(--ok)}
.stat-card.danger .vl{color:var(--danger2)}
.query{padding:14px 16px 2px;margin-bottom:12px}
.query .el-form-item{margin-bottom:12px;margin-right:14px}
.ops{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ops .grow{margin-left:auto;color:var(--sub);font-size:13px}
.table-card{padding:6px 6px 0}
.table-card .el-table{--el-table-header-bg-color:var(--headbg);--el-table-header-text-color:var(--headtex)}
.table-card .el-table th.el-table__cell{font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 10px}
.pager .batch{color:var(--sub);font-size:13px}
.link{color:var(--el-color-primary);cursor:pointer}
.link:hover{text-decoration:underline}
.mono{font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--sub)}
.danger-text{color:var(--danger2)}
.ok-text{color:var(--ok)}
.row-actions .el-button+.el-button{margin-left:6px}
/* workbench */
.wb-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.wb-hello{background:linear-gradient(120deg,var(--navy),var(--el-color-primary) 70%,var(--el-color-primary-light-3));color:#fff;border-radius:10px;padding:18px 24px;display:flex;align-items:center;margin-bottom:14px}
.wb-hello h2{margin:0 0 4px;font-size:20px;font-weight:600}
.wb-hello .d{opacity:.8;font-size:13px}
.wb-hello .seg{margin-left:auto;display:flex;gap:28px}
.wb-hello .seg div{text-align:center}.wb-hello .seg b{display:block;font-size:22px}.wb-hello .seg span{font-size:12px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick .q{border:1px solid var(--line);border-radius:10px;padding:12px 4px;text-align:center;cursor:pointer;background:var(--soft);transition:.15s}
.quick .q:hover{border-color:var(--el-color-primary);background:var(--el-color-primary-light-9)}
.quick .q .el-icon{font-size:22px;color:var(--el-color-primary);margin-bottom:6px}
.quick .q div{font-size:13px}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.todo-item:hover{background:var(--el-color-primary-light-9)}
.todo-item .dot{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.todo-item .n{margin-left:auto;font-weight:600;font-size:16px}
.todo-item .n small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.tl-line{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.tl-line:last-child{border-bottom:0}
.tl-line .t{width:92px;flex:none;color:var(--el-color-primary);font-weight:600;font-variant-numeric:tabular-nums}
.sch{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.sch .tm{width:46px;font-weight:600;font-variant-numeric:tabular-nums}
.sch .bar{width:3px;border-radius:2px;align-self:stretch;background:var(--el-color-primary)}
.msg{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.msg:last-child{border-bottom:0}
.msg .u{width:7px;height:7px;border-radius:50%;background:var(--danger);margin-top:7px;flex:none}
.msg .u.read{background:transparent}
.msg.read{color:var(--sub)}
.perf-num{display:flex;gap:26px;margin:4px 0 10px}
.perf-num b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.perf-num span{font-size:12px;color:var(--sub)}
/* detail */
.cust-head{padding:18px 22px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
.cust-logo{width:56px;height:56px;border-radius:12px;background:var(--el-color-primary-light-8);color:var(--el-color-primary);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.cust-head h2{margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:8px}
.cust-meta{display:flex;gap:22px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.cust-meta b{color:var(--text);font-weight:500}
.sum-cards{display:flex;gap:12px;margin-left:auto}
.sum-card{border:1px solid var(--line);border-radius:10px;padding:10px 18px;min-width:116px;text-align:center;background:var(--soft)}
.sum-card .v{font-size:22px;font-weight:600;color:var(--el-color-primary);font-variant-numeric:tabular-nums}
.sum-card .l{font-size:12px;color:var(--sub)}
.detail-tabs .el-tabs__header{margin-bottom:0}
.tab-body{padding:16px 6px 6px}
.tl-item-card{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:2px}
.sec-title{font-weight:600;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:before{content:"";width:3px;height:14px;background:var(--el-color-primary);border-radius:2px}
.org-tree .el-tree-node__content{height:34px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--tint);border-radius:10px;padding:10px;min-height:560px;border:2px solid transparent}
.kcol.over{border-color:var(--el-color-primary);background:var(--el-color-primary-light-8)}
.kcol-h{display:flex;align-items:center;gap:6px;padding:2px 4px 8px}
.kcol-h b{font-size:14px}
.kcol-h .cnt{background:var(--card);border-radius:10px;padding:0 8px;font-size:12px;color:var(--el-color-primary);font-weight:600}
.kcol-sum{font-size:12px;color:var(--sub);padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.kcard{background:var(--card);border-radius:8px;padding:10px 10px;margin-bottom:10px;cursor:grab;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,40,80,.05)}
.kcard:hover{box-shadow:0 4px 12px rgba(15,40,80,.12);border-color:var(--el-color-primary-light-5)}
.kcard .nm{font-weight:600;margin-bottom:4px;line-height:1.4}
.kcard .cu{font-size:12px;color:var(--sub);margin-bottom:8px}
.kcard .am{font-size:16px;font-weight:600;color:var(--el-color-primary);font-variant-numeric:tabular-nums}
.kcard .ft{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);margin-top:8px;white-space:nowrap}
.kcard .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.kcard .ft .adv{margin-left:auto}
.kmore{text-align:center;font-size:12px;color:var(--sub);padding:6px}
.gate-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--soft)}
.gate-row.bad{border-color:var(--danger);background:var(--el-color-danger-light-9,#fef0f0)}
.gate-row .st{width:20px;flex:none;margin-top:4px}
.stage-flow{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
/* quote */
.amt-box{margin-left:auto;width:360px;border:1px solid var(--line);border-radius:10px;padding:12px 18px;background:var(--soft)}
.amt-box .r{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.amt-box .r.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:18px;font-weight:700;color:var(--el-color-primary)}
.flow{display:flex;align-items:flex-start;gap:0;padding:6px 0 4px}
.fnode{display:flex;flex-direction:column;align-items:center;min-width:132px;text-align:center;position:relative}
.fnode .c{width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--sub);display:flex;align-items:center;justify-content:center;font-weight:600;z-index:1;border:2px solid var(--tint)}
.fnode.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.fnode.cur .c{background:var(--card);border-color:var(--el-color-primary);color:var(--el-color-primary);box-shadow:0 0 0 4px rgba(47,155,255,.15)}
.fnode.rej .c{background:var(--danger);border-color:var(--danger);color:#fff}
.fnode .nm{margin-top:6px;font-size:13px;font-weight:600}.fnode .pp{font-size:12px;color:var(--sub)}
.fline{flex:1;min-width:28px;height:2px;background:var(--tint);margin-top:15px}
.fline.done{background:var(--ok)}
.appr-wrap{display:grid;grid-template-columns:480px minmax(0,1fr);gap:14px;align-items:start}
.appr-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left:3px solid transparent}
.appr-item:hover{background:var(--soft)}
.appr-item.active{background:var(--el-color-primary-light-9);border-left-color:var(--el-color-primary)}
.appr-item .tt{font-weight:600;display:flex;gap:8px;align-items:center}
.appr-item .tt .el-tag{margin-left:auto}
.appr-item .sm{font-size:12px;color:var(--sub);display:flex;gap:12px}
.opinion{padding:10px 14px;background:var(--soft);border-radius:8px;border:1px solid var(--line);margin-bottom:8px}
/* mobile preview */
.mob-wrap{display:flex;gap:48px;justify-content:center;align-items:flex-start;padding:10px 0}
.phone{width:370px;height:730px;border-radius:46px;background:#181b20;padding:12px;box-shadow:0 20px 50px rgba(15,40,80,.3),inset 0 0 0 2px #3a3f47;flex:none}
.screen{width:100%;height:100%;border-radius:36px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.m-status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:12px;font-weight:600;background:transparent}
.m-notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:96px;height:22px;background:#111;border-radius:12px}
.m-body{flex:1;overflow-y:auto;padding:0 14px 14px}
.m-body::-webkit-scrollbar{width:0}
.m-hero{background:linear-gradient(135deg,var(--navy2),var(--el-color-primary));color:#fff;border-radius:16px;padding:16px;margin:4px 0 12px}
.m-hero h3{margin:0 0 4px;font-size:18px}
.m-hero p{margin:0;font-size:12px;opacity:.85}
.m-stats{display:flex;gap:10px;margin-top:14px}
.m-stats div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px;text-align:center}
.m-stats b{font-size:24px;display:block}.m-stats span{font-size:12px;opacity:.85}
.m-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.m-card h4{margin:0 0 12px;font-size:15px}
.m-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.m-quick .qi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.m-quick .qi i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:normal}
.m-todo{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.m-todo:last-child{border-bottom:0}
.m-todo .tm{font-weight:700;color:var(--el-color-primary);width:48px;font-variant-numeric:tabular-nums}
.m-tabbar{height:64px;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:6px}
.m-tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub);cursor:pointer}
.m-tabbar div .el-icon{font-size:22px}
.m-tabbar div.on{color:var(--el-color-primary);font-weight:600}
.m-list-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.m-list-item:last-child{border-bottom:0}
.m-ava{width:38px;height:38px;border-radius:10px;background:var(--el-color-primary-light-8);color:var(--el-color-primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mob-side{max-width:440px}
.mob-side h3{margin:0 0 10px}
.mob-side table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden}
.mob-side td,.mob-side th{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left}
.mob-side th{background:var(--headbg)}
.ph-note{margin-bottom:12px}
/* 需求文档面板（半隐藏窄条 / 完全展开 / 隐藏时浮标） */
.doc-fab{position:fixed;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-lr;letter-spacing:2px;background:var(--el-color-primary);color:#fff;border-radius:8px 0 0 8px;padding:12px 6px;font-size:13px;display:flex;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:60}
.doc-fab .el-icon{writing-mode:horizontal-tb}
.doc-fab:hover{filter:brightness(1.05);text-decoration:none}
.doc-panel{position:fixed;right:0;top:56px;bottom:0;background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(15,40,80,.08);display:flex;flex-direction:column;z-index:59;overflow:hidden}
.doc-panel.half{width:280px}
.doc-panel.full{width:520px}
.doc-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none;background:var(--card)}

.doc-sec{margin-bottom:6px;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.doc-item .tx{flex:1;word-break:break-all}
.doc-item .tx mark{background:var(--el-color-primary-light-7);color:inherit;border-radius:2px;padding:0 1px}

.doc-item:hover .it-ops{opacity:1}

.doc-tip{padding:10px;color:var(--sub);font-size:12px;display:flex;align-items:center;gap:4px}
.doc-empty{padding:14px;color:var(--sub);font-size:13px}

.row-overdue td.el-table__cell{background:var(--el-color-danger-light-9,#fff6f5)!important}

const TAX_RATE_BP = 1300; // 13.00%（基点）
const DISCOUNT_RULES = [
  { max: 500, role: '销售人员（授权范围内，自动通过）' }, { max: 1000, role: '销售经理' }, { max: 2000, role: '销售总监' }, { max: 10001, role: '总经理 / 财务负责人（低于价格底线）' } ];
function calcQuote(items) {
  let orig = 0, sub = 0;
  const rows = items.map(it => {
    const stdC = toC(it.price);
    const dealC = Math.round(stdC * it.disc / 100);           // 成交单价（分）
    const lineOrig = stdC * it.qty, lineSub = dealC * it.qty;
    orig += lineOrig; sub += lineSub;
    return { ...it, stdC, dealC, lineSub };
  });
  const discount = orig - sub;
  const tax = Math.round(sub * TAX_RATE_BP / 10000);
  const discBp = orig ? Math.round(discount * 10000 / orig) : 0;
  const rule = DISCOUNT_RULES.find(r => discBp <= r.max);
  return { rows, orig, sub, discount, tax, total: sub + tax, discBp, rule };
}

    const ym = extPick(r, ['202607', '202608', '202609', '202610', '202611']);
    mc[ym] = (mc[ym] || 0) + 1;
    let company = '', convNo = '';
    if (i % 5 === 3) { const c = custs[(i * 3) % custs.length]; company = c.name; convNo = c.no; }
    else {
      const pc = EXT_CITY[(i * 5 + 1) % EXT_CITY.length];
      company = pc[1] + '某某' + EXT_BUSS[(i * 3 + 7) % EXT_BUSS.length] + '有限公司';
      if (out.some(x => x.company === company) || custs.some(c => c.name === company)) company = company.replace('有限公司', '股份有限公司');
    }
    const st = i < 8 ? '新建' : (i < 18 ? '跟进中' : (i < 21 ? '已转化' : (i < 26 ? '新建' : '无效')));
    const owner = st === '新建' && extCh(r, 0.4) ? '' : extOwner(r);
    const created = (ym === '202611' ? extAddDays(TODAY, -extRint(r, 0, 8)) : ym.slice(0, 4) + '-' + ym.slice(4) + '-' + extPad(extRint(r, 1, 28), 2)) + (extCh(r, 0.5) ? ' 09:00' : ' 14:30');
    const item = {
      no: 'XS-' + ym + '-' + extPad(40 + mc[ym], 4),
      name: extShort(company) + ' ' + extPick(r, themes),
      company,
      contact: contacts[(i * 3 + 2) % contacts.length],
      phone: extPhone(r), source: extPick(r, ['官网', '广告', '渠道', '活动', '转介绍']),
      need: extPick(r, needs), amount: extRint(r, 4, 90) * 10000,
      status: st, owner,
      next: st === '跟进中' ? extAddDays(TODAY, extRint(r, 1, 10)) + ' 10:00' : '',
      created,
    };
    if (st === '已转化') { item.convertedAt = extAddDays(item.created.slice(0, 10), extRint(r, 3, 15)) + ' 11:00'; item.convertedTo = convNo; }
    if (st === '跟进中' && i % 6 === 2) item.dup = { type: '线索', ref: 'XS-202611-0008', why: '手机号相同' };
    out.push(item);
  }
  EXT_EXTRA_LEADS = out;
  return out;
}

/* ===== 主体：buildExt(customers, leads, opps) → 所有实体 + 关系图数据 ===== */
function buildExt(customers, leads, opps) {
  const byName = {}; const byNo = {};
  customers.forEach(c => { byName[c.name] = c; byNo[c.no] = c; });
  const oppsByCust = {};
  opps.forEach(o => { (oppsByCust[o.customer] = oppsByCust[o.customer] || []).push(o); });

  /* ---------- 1) 联系人 ---------- */
  const contacts = [];
  const contactsByCust = {};
  customers.forEach(c => { contactsByCust[c.name] = []; });
  const usedNames = new Set(['陈总监', '刘经理', '周会计', '黄工', '周主任', '管理员', '孙工', '钱工', '林晓', '陈悦', '毛科生', '李彬文', '何启明', '苏简', '王芳', '李琴', '周总监']);
  let lxSeq = 1;
  const pushC = c => { contacts.push(c); contactsByCust[c.customer].push(c); };
  EXT_NJ_CONTACTS.forEach(pushC);
  lxSeq = 5;
  const ROLE_DEPTS = {
    使用人: ['运营部', '生产管理部', '客服部', '门店管理部', '仓储部'],
    采购人: ['采购部', '供应链管理部'], 财务: ['财务部'], 技术: ['技术部', 'IT 部', '信息中心'],
  };
  const ROLE_TITLES = {
    使用人: ['运营经理', '系统管理员', '业务主管', '业务专员', '客服主管'],
    采购人: ['采购经理', '采购主管', '采购专员'], 财务: ['财务经理', '财务主管', '出纳'],
    技术: ['系统工程师', '技术主管', 'IT 架构师', '技术经理'],
  };
  const makeContact = (r, cu, role, firstNo) => {
    const isDec = role === '决策人';
    const dept = isDec ? extPick(r, ['总经理办公室', '经营管理部', '信息中心']) : extPick(r, ROLE_DEPTS[role]);
    const title = isDec ? extPick(r, ['总经理', '副总经理', 'CIO', '采购总监', '副总裁']) : extPick(r, ROLE_TITLES[role]);
    const nm = extGenName(r, usedNames);
    const no = 'LX-' + extPad(lxSeq++, 6);
    const infl = isDec ? extPick(r, ['高', '高', '中']) : extPick(r, ['高', '中', '中', '低', '低']);
    return {
      no, name: nm.name, customer: cu.name, phone: extPhone(r),
      email: nm.py + no.slice(3) + '@example.com', dept, title, role, infl,
      pref: extPick(r, ['电话', '微信', '邮件']),
      key: isDec || infl === '高' ? true : extCh(r, 0.25),
      attitude: isDec ? extPick(r, ['支持者', '支持者', '中立', '反对者']) : extPick(r, ['支持者', '中立', '中立', '反对者']),
      reportsTo: isDec || !firstNo || extCh(r, 0.4) ? '' : firstNo,
      birthday: '19' + extPad(extRint(r, 60, 99), 2) + '-' + extPad(extRint(r, 1, 12), 2) + '-' + extPad(extRint(r, 1, 28), 2),
      remark: extPick(r, EXT_REMARKS),
      owner: cu.owner || '',
    };
  };
  const genBlock = (cu, n, decNo) => {
    const r = extRng(extHash(cu.no + '|contacts'));
    let firstNo = decNo || '';
    for (let i = 0; i < n; i++) {
      const role = i === 0 && !decNo ? '决策人' : extPick(r, ['使用人', '使用人', '使用人', '采购人', '财务', '技术']);
      const c = makeContact(r, cu, role, firstNo);
      pushC(c);
      if (i === 0 && !decNo) firstNo = c.no;
    }
  };
  const CONTACT_COUNTS = {
    'KH-202611-0001': 4, 'KH-202611-0002': 7, 'KH-202610-0021': 7, 'KH-202610-0018': 6, 'KH-202610-0015': 6,
    'KH-202609-0032': 6, 'KH-202609-0027': 5, 'KH-202608-0009': 3, 'KH-202608-0004': 5, 'KH-202607-0012': 4, 'KH-202606-0008': 3,
  };
  customers.forEach(cu => {
    if (cu.no === 'KH-202611-0001') { genBlock(cu, 4, 'LX-000001'); return; }
    if (cu.no === 'KH-202611-0002') {
      const keep = { no: 'LX-' + extPad(lxSeq++, 6), name: '周主任', customer: cu.name, phone: '135****9021', email: 'zhouzr@example.com', dept: '采购部', title: '采购主任', role: '采购人', infl: '高', pref: '电话', key: true, attitude: '中立', reportsTo: '', birthday: '1972-03-16', remark: '集团统一采购牵头人', owner: cu.owner || '' };
      pushC(keep);
      genBlock(cu, 7, null);
      return;
    }
    let n;
    if (CONTACT_COUNTS[cu.no] != null) n = CONTACT_COUNTS[cu.no];
    else { const r = extRng(extHash(cu.no + '|cnt')); n = cu.status === '流失' || !cu.owner ? 2 + Math.floor(r() * 2) : 2 + Math.floor(r() * 4); }
    genBlock(cu, n, null);
  });

  /* ---------- 2) 产品 / 价格表 ---------- */
  const products = EXT_PRODUCTS.map(p => ({ ...p }));
  const pricebooks = [
    { no: 'PB-001', name: '标准价', type: '标准价', validFrom: '2026-01-01', validTo: '2026-12-31', status: '启用', items: [] },
    { no: 'PB-002', name: '重点客户价', type: '重点客户价', validFrom: '2026-01-01', validTo: '2026-12-31', status: '启用', items: [] },
    { no: 'PB-003', name: '渠道价', type: '渠道价', validFrom: '2026-01-01', validTo: '2026-12-31', status: '启用', items: [] },
  ];
  products.forEach(p => {
    pricebooks[0].items.push({ productNo: p.no, price: p.price, minDiscount: 85 });
    pricebooks[1].items.push({ productNo: p.no, price: Math.max(1, Math.round(p.price * 0.92)), minDiscount: 90 });
    pricebooks[2].items.push({ productNo: p.no, price: Math.max(1, Math.round(p.price * 0.82)), minDiscount: 80 });
  });

  /* ---------- 3) 报价（保留 4 条 + 生成） ---------- */
  const quotes = EXT_QUOTES_PRES.map(q => ({
    no: q.no, customer: q.customer, opp: q.opp, amount: q.amount, disc: q.disc, date: q.date, valid: q.valid,
    owner: q.owner, appr: q.appr, ver: q.ver, items: JSON.parse(JSON.stringify(q.items)),
  }));
  let bjSeq = 100;
  const genItems = r => {
    const nItems = 1 + Math.floor(r() * 3);
    const chosen = [];
    for (let k = 0; k < 12 && chosen.length < nItems; k++) {
      const p = extPick(r, products);
      if (chosen.some(x => x.productNo === p.no)) continue;
      const qty = p.unit === '用户·年' ? extPick(r, [10, 20, 30, 40, 50]) : (p.unit === '人天' ? extRint(r, 5, 45) : extRint(r, 1, 3));
      chosen.push({ productNo: p.no, name: p.name, qty, unit: p.unit, price: p.price, discount: extPick(r, [100, 100, 95, 92, 90, 88, 85, 80]) });
    }
    if (!chosen.length) { const p = extPick(r, products); chosen.push({ productNo: p.no, name: p.name, qty: 1, unit: p.unit, price: p.price, discount: 92 }); }
    return chosen;
  };
  const genQuote = (cu, r) => {
    const ym = extPick(r, ['202601', '202602', '202603', '202604', '202606', '202608', '202609', '202610', '202611']);
    const items = genItems(r);
    let orig = 0, sub = 0;
    items.forEach(it => { orig += it.price * it.qty; sub += Math.round(it.price * it.qty * it.discount / 100); });
    const myOpps = oppsByCust[cu.name] || [];
    const opp = myOpps.length && extCh(r, 0.8) ? extPick(r, myOpps).no : '';
    const date = ym === '202611' ? extAddDays(TODAY, -extRint(r, 0, 20)) : ym.slice(0, 4) + '-' + ym.slice(4) + '-' + extPad(extRint(r, 1, 28), 2);
    return {
      no: 'BJ-' + ym + '-' + extPad(bjSeq++, 4),
      customer: cu.name, opp, amount: Math.round(sub * 1.13 * 100) / 100,
      disc: Math.round((orig - sub) * 100) / 100,
      date, valid: extAddDays(date, 30),
      owner: cu.owner || '',
      appr: extPick(r, ['已通过', '已通过', '已通过', '已通过', '审批中', '草稿', '已驳回']),
      ver: extPick(r, ['V1', 'V1', 'V2']),
      items,
    };
  };
  customers.forEach(cu => {
    if (EXT_ORIG_NO.has(cu.no)) {
      const r = extRng(extHash(cu.no + '|quotes'));
      const nq = cu.owner ? (cu.status === '流失' ? 1 : 2 + Math.floor(r() * 2)) : 1;
      for (let i = 0; i < nq; i++) quotes.push(genQuote(cu, r));
    } else {
      const r = extRng(extHash(cu.no + '|quotes'));
      if (cu.owner && extCh(r, 0.55)) quotes.push(genQuote(cu, r));
    }
  });
  let qi = 0;
  while (quotes.length < 34) { const cu = customers[qi % customers.length]; quotes.push(genQuote(cu, extRng(extHash(cu.no + '|topq' + qi)))); qi++; }

  /* ---------- 4) 合同（保留 7 条 + 由已通过报价派生 + 补足） ---------- */
  const contracts = EXT_CONTRACTS_PRES.map(c => ({ ...c, plans: c.plans.map(p => ({ ...p })), attachments: c.attachments.map(a => ({ ...a })), approvals: c.approvals.map(a => ({ ...a })) }));
  let htSeq = 100;
  const PAY_TERMS = [
    [['合同签署', 30], ['项目上线', 40], ['项目验收', 30]], [['预付款', 50], ['验收款', 50]],
    [['首付款', 60], ['尾款', 40]], [['合同签署', 30], ['上线试运行', 40], ['终验', 30]],
  ];
  const genContract = (quote, cu, r) => {
    const ym = quote ? quote.date.slice(0, 7).replace('-', '') : extPick(r, ['202509', '202511', '202602', '202603', '202605', '202606']);
    const theme = extPick(r, ['软件授权与实施', '平台建设', '定制开发', '系统升级', '年度服务', '模块采购', '数据平台建设', '渠道系统建设']);
    const signDate = quote ? extAddDays(quote.date, extRint(r, 3, 12)) : ym.slice(0, 4) + '-' + ym.slice(4) + '-' + extPad(extRint(r, 1, 28), 2);
    const startDate = extAddDays(signDate, extRint(r, 1, 8));
    const amount = quote ? quote.amount : extRint(r, 4, 70) * 10000;
    const status = quote ? extPick(r, ['履约中', '履约中', '履约中', '已完成', '已签署', '审批中', '草稿', '已终止', '已到期']) : extPick(r, ['履约中', '已完成', '已终止', '已到期']);
    const terms = PAY_TERMS[extRint(r, 0, PAY_TERMS.length - 1)];
    const plans = terms.map((t, idx) => {
      const d = idx === 0 ? signDate : extAddDays(startDate, Math.round(idx * 55 * (1 + r() * 0.4)));
      const stt = status === '草稿' || status === '已终止' ? '未回款' : (idx === 0 && status !== '审批中' && status !== '草稿' ? '已回款' : (d < extAddDays(TODAY, -5) ? '部分回款' : '未回款'));
      return { stage: t[0], date: d, amount: Math.round(amount * t[1]) / 100, status: stt };
    });
    return {
      no: 'HT-' + ym + '-' + extPad(htSeq++, 4),
      name: extShort(cu.name) + ' ' + theme + '合同',
      customer: cu.name, opp: quote ? quote.opp : '', quote: quote ? quote.no : '',
      type: extPick(r, ['销售合同', '服务合同', '续费合同']),
      amount, signDate, startDate, endDate: extAddDays(startDate, extPick(r, [180, 270, 365, 365, 730])),
      status, owner: cu.owner || '',
      payTerms: terms.map(t => t[0] + ' ' + t[1] + '%').join(' / '),
      plans,
      attachments: status === '草稿' || status === '审批中' ? [] : [ { name: '合同扫描件.pdf', size: '1.8MB', date: signDate }, { name: '付款条款确认函.pdf', size: '320KB', date: signDate } ],
      approvals: status === '审批中'
        ? [ { node: '发起申请', who: quote ? quote.owner : (cu.owner || ''), result: '提交', time: extAddDays(signDate, 0) + ' 09:40' }, { node: '销售经理', who: extPick(r, ['张三', '李四', '周总监']), result: '待审批', time: '' } ]
        : (status === '草稿' ? [] : [ { node: '发起申请', who: quote ? quote.owner : (cu.owner || ''), result: '提交', time: extAddDays(signDate, -3) + ' 09:40' }, { node: '销售经理', who: extPick(r, ['张三', '李四', '周总监']), result: '同意', time: extAddDays(signDate, -1) + ' 14:20' } ]),
    };
  };
  quotes.filter(q => q.appr === '已通过' && byName[q.customer]).forEach(q => {
    contracts.push(genContract(q, byName[q.customer], extRng(extHash(q.no + '|c'))));
  });
  let ci = 0;
  while (contracts.length < 32) { const cu = customers[ci % customers.length]; contracts.push(genContract(null, cu, extRng(extHash(cu.no + '|topc' + ci)))); ci++; }

  /* ---------- 5) 订单（保留 6 条 + 由合同派生 + 补足） ---------- */
  const orders = EXT_ORDERS_PRES.map(o => {
    const c = contracts.find(x => x.no === o.contract) || null;
    const q = c && c.quote ? quotes.find(x => x.no === c.quote) : null;
    const items = q ? q.items.map(it => ({ ...it })) : genItems(extRng(extHash(o.no + '|oi')));
    return {
      no: o.no, customer: o.customer, contract: o.contract, opp: o.opp, amount: o.amount, date: o.date, dlv: o.dlv,
      owner: o.owner, status: o.status, items,
      invoiceStatus: o.status === '已完成' ? '已开票' : (o.status === '待确认' ? '未开票' : '部分开票'),
      shipStatus: o.status === '已完成' ? '已签收' : (o.status === '待确认' ? '未发货' : '已发货'),
      address: ((byName[o.customer] || {}).region || '') + '某某产业园',
    };
  });
  let ddSeq = 100;
  const takenContracts = new Set(EXT_ORDERS_PRES.map(o => o.contract));
  const genOrder = (c, r) => {
    const ym = c.signDate ? c.signDate.slice(0, 7).replace('-', '') : extPick(r, ['202604', '202606', '202609', '202610']);
    const q = c.quote ? quotes.find(x => x.no === c.quote) : null;
    const items = q ? q.items.map(it => ({ ...it })) : genItems(r);
    const status = extPick(r, ['待确认', '待确认', '备货中', '交付中', '交付中', '已完成', '已完成', '已取消']);
    const cu = byName[c.customer] || {};
    return {
      no: 'DD-' + ym + '-' + extPad(ddSeq++, 4),
      customer: c.customer, contract: c.no, opp: c.opp || '',
      amount: c.amount, date: extAddDays(c.signDate || TODAY, extRint(r, 0, 5)), dlv: extAddDays(c.signDate || TODAY, extRint(r, 20, 80)),
      owner: c.owner, status, items,
      invoiceStatus: status === '已完成' ? '已开票' : (status === '待确认' ? '未开票' : '部分开票'),
      shipStatus: status === '已完成' ? '已签收' : (status === '待确认' ? '未发货' : (status === '备货中' ? '未发货' : '已发货')),
      address: (cu.region || '') + '某某产业园',
    };
  };
  contracts.forEach(c => {
    if (takenContracts.has(c.no)) return;
    if (c.status === '已签署' || c.status === '履约中' || c.status === '已完成' || c.status === '已到期') orders.push(genOrder(c, extRng(extHash(c.no + '|o'))));
  });
  let oi = 0;
  while (orders.length < 32) { const cu = customers[oi % customers.length]; orders.push(genOrder({ customer: cu.name, no: '', amount: extRint(extRng(extHash(cu.no + '|amo' + oi)), 3, 60) * 10000, signDate: '', owner: cu.owner || '', status: '待确认' }, extRng(extHash(cu.no + '|topo' + oi)))); oi++; }

  /* ---------- 6) 交付项目（保留 3 条 + 由订单派生） ---------- */
  const deliveries = EXT_DELIVERIES_PRES.map(d => ({ ...d }));
  deliveries[0].milestones = [
    { name: '启动会', date: '2026-10-22', status: '已完成' }, { name: '蓝图设计', date: '2026-11-05', status: '已完成' },
    { name: '系统配置', date: '2026-11-25', status: '进行中' }, { name: '数据迁移', date: '2026-12-05', status: '未开始' },
    { name: '上线切换', date: '2026-12-10', status: '未开始' } ];
  deliveries[0].risk = '';
  deliveries[1].milestones = [
    { name: '启动会', date: '2026-08-20', status: '已完成' }, { name: '系统配置', date: '2026-09-15', status: '已完成' },
    { name: '接口联调', date: '2026-10-30', status: '进行中' }, { name: '验收测试', date: '2026-11-15', status: '未开始' } ];
  deliveries[1].risk = '客户侧接口联调延迟，存在延期风险';
  deliveries[2].milestones = [
    { name: '启动会', date: '2026-07-08', status: '已完成' }, { name: '用户体验培训', date: '2026-07-25', status: '已完成' },
    { name: '验收测试', date: '2026-08-20', status: '已完成' } ];

/* ===== 客户 360：一次返回该客户的全部相关数据（ECharts 关系图 / 决策链） ===== */
function customerBundle(ext, customerName, oppsIn) {
  const opIn = oppsIn || (typeof store !== 'undefined' && store.opps) || [];
  const nm = customerName;
  const pick = arr => (arr || []).filter(x => x.customer === nm);
  const contacts = (ext.contacts || []).filter(c => c.customer === nm);
  const quoted = pick(ext.quotes).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const bc = {
    customer: (ext.customers || []).find(c => c.name === nm) || null,
    contacts,
    activities: pick(ext.activities).slice().sort((a, b) => (a.time < b.time ? 1 : -1)),
    opps: (opIn || []).filter(o => o.customer === nm).slice().sort((a, b) => b.amount - a.amount),
    quotes: quoted,
    contracts: pick(ext.contracts).slice().sort((a, b) => ((a.signDate || '') < (b.signDate || '') ? 1 : -1)),
    orders: pick(ext.orders).slice().sort((a, b) => (a.date < b.date ? 1 : -1)),
    deliveries: pick(ext.deliveries),
    tickets: pick(ext.tickets).slice().sort((a, b) => (a.created < b.created ? 1 : -1)),
    relations: (ext.relations || {})[nm] || { nodes: [], edges: [] },
    files: [],
  };
  bc.contracts.forEach(t => (t.attachments || []).forEach(a => bc.files.push({ name: a.name, type: '合同附件', ref: t.no, size: a.size, date: a.date })));
  bc.quotes.forEach(q => bc.files.push({ name: '报价单 ' + q.no + '（' + q.ver + '）.pdf', type: '报价单', ref: q.no, size: '260KB', date: q.date }));
  bc.tickets.forEach(t => (t.images || []).forEach(img => bc.files.push({ name: img, type: '工单图片', ref: t.no, size: '480KB', date: (t.created || '').slice(0, 10) })));
  return bc;
}

/* ===== 路由注册表 ===== */
const ROUTES = [];
const registerRoute = (pattern, comp, docKey, propsFn) => {
  ROUTES.push({ pattern, segs: pattern.split('/').filter(Boolean), comp, docKey, propsFn });
};
const matchRoute = path => {
  const segs = path.split('/').filter(Boolean);
  for (const r of ROUTES) {
    if (r.segs.length !== segs.length) continue;
    const params = {}; let ok = true;
    r.segs.forEach((s, i) => { if (s[0] === ':') params[s.slice(1)] = decodeURIComponent(segs[i]); else if (s !== segs[i]) ok = false; });
    if (ok) return Object.assign({}, r, { params, props: r.propsFn ? r.propsFn(params) : Object.assign({}, params) });
  }
  return null;
};

/* ===== 需求文档说明面板：三种状态（隐藏 / 半隐藏 / 完全展开），内容可增删改，存 localStorage ===== */
const DOC_STATE_KEY = 'crm_doc_state';
const DOC_DATA_KEY = 'crm_docs_v1';

const docDeep = o => JSON.parse(JSON.stringify(o));
const docReadOverride = () => { try { return JSON.parse(localStorage.getItem(DOC_DATA_KEY) || '{}') || {}; } catch (e) { return {}; } };

const DocPanel = {
  setup() {
    const mode = ref(['hidden', 'half', 'full'].includes(localStorage.getItem(DOC_STATE_KEY)) ? localStorage.getItem(DOC_STATE_KEY) : 'half');
    const setMode = m => { if (!['hidden', 'half', 'full'].includes(m)) return; mode.value = m; try { localStorage.setItem(DOC_STATE_KEY, m); } catch (e) {} };
    setMode(mode.value);
    const kw = ref('');
    const overrides = reactive(docReadOverride());
    const curKey = computed(() => docState.override || docState.key);
    const doc = computed(() => {
      const key = curKey.value;
      if (!key || !DOCS_DEFAULT[key]) return null;
      const d = docDeep(DOCS_DEFAULT[key]);
      const ov = overrides[key] && overrides[key].sections;
      if (ov) Object.keys(ov).forEach(i => { if (d.sections[i]) d.sections[i].items = (ov[i] || []).slice(); });
      return d;
    });
    const view = computed(() => {
      const d = doc.value; if (!d) return [];
      const k = kw.value.trim();
      const arr = d.sections.map((s, i) => ({ i, t: s.t, items: s.items }));
      if (!k) return arr;
      return arr.map(s => Object.assign({}, s, { items: s.items.filter(x => x.includes(k)) })).filter(s => s.items.length);
    });
    const save = () => { try { localStorage.setItem(DOC_DATA_KEY, JSON.stringify(overrides)); } catch (e) {} };
    const material = si => { const d = doc.value; const key = curKey.value; const items = d.sections[si].items.slice(); overrides[key] = overrides[key] || {}; if (!overrides[key].sections) overrides[key].sections = {}; overrides[key].sections[si] = items; return overrides[key].sections[si]; };
    const promptItem = (title, init) => ElMessageBox.prompt('请输入条目内容（保存到本地存储，可随时“恢复默认”还原）：', title, { confirmButtonText: '保存', cancelButtonText: '取消', inputType: 'textarea', inputValue: init || '', inputPattern: /\S/, inputErrorMessage: '内容不能为空' });
    const addItem = si => promptItem('新增条目').then(({ value }) => { material(si).push((value || '').trim()); save(); ElMessage.success('已保存到本地'); }).catch(() => {});
    const editItem = (si, ii) => promptItem('编辑条目', doc.value.sections[si].items[ii]).then(({ value }) => { material(si)[ii] = (value || '').trim(); save(); ElMessage.success('已保存到本地'); }).catch(() => {});
    const delItem = (si, ii) => ElMessageBox.confirm('确认删除该条目？', '删除', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' }).then(() => { material(si).splice(ii, 1); save(); ElMessage.success('已删除'); }).catch(() => {});
    const resetCur = () => ElMessageBox.confirm('恢复本页需求文档为默认内容？', '恢复默认（本页）', { type: 'warning', confirmButtonText: '恢复', cancelButtonText: '取消' }).then(() => { delete overrides[curKey.value]; save(); ElMessage.success('已恢复默认'); }).catch(() => {});
    const resetAll = () => ElMessageBox.confirm('恢复全部页面的需求文档为默认内容？将清除所有本地修改。', '恢复默认（全部）', { type: 'warning', confirmButtonText: '全部恢复', cancelButtonText: '取消' }).then(() => { Object.keys(overrides).forEach(k => delete overrides[k]); save(); ElMessage.success('已全部恢复默认'); }).catch(() => {});
    const fileEl = ref(null);
    const importJson = () => fileEl.value && fileEl.value.click();
    const onFile = ev => {
      const f = ev.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const data = JSON.parse(rd.result) || {};
          Object.keys(data).forEach(k => { if (DOCS_DEFAULT[k] && data[k].sections) overrides[k] = { sections: data[k].sections }; });
          save(); ElMessage.success('导入成功');
        } catch (e) { ElMessage.error('导入失败：文件格式不正确'); }
      };
      rd.readAsText(f); ev.target.value = '';
    };
    const exportJson = () => {
      const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'crm-docs.json'; a.click(); URL.revokeObjectURL(a.href);
    };
    const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const hl = x => {
      const k = kw.value.trim();
      if (!k) return escapeHtml(x);
      const re = new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      return escapeHtml(x).replace(re, m => '<mark>' + m + '</mark>');
    };
    return { mode, setMode, kw, doc, view, curKey, addItem, editItem, delItem, resetCur, resetAll, exportJson, importJson, onFile, fileEl, hl };
  },
  template: `<div v-if="doc">
    <a v-if="mode==='hidden'" class="doc-fab" @click="setMode('half')" title="需求文档说明"><el-icon><document/></el-icon><span>文档</span></a>
    <div v-else class="doc-panel" :class="mode">
      <div class="doc-head">
        <div class="doc-tt"><span class="doc-badge">需求文档</span><b>{{ doc.name }}</b><span class="doc-mod">{{ doc.module }}</span></div>
        <div class="doc-icons">
          <el-icon v-if="mode==='half'" class="doc-act doc-act-full" title="完全展开" @click="setMode('full')"><expand/></el-icon>
          <el-icon v-if="mode==='full'" class="doc-act doc-act-half" title="收窄" @click="setMode('half')"><subtract/></el-icon>
          <el-icon class="doc-act doc-act-hide" title="隐藏面板" @click="setMode('hidden')"><close/></el-icon>
        </div>
      </div>
      <div class="doc-body">
        <template v-if="mode==='half'">
          <div class="doc-sec"><div class="doc-sech"><span class="idx">2</span>页面目标</div><p class="doc-goal">{{ doc.sections[1].items.join(' ') }}</p></div>
          <div class="doc-sec"><div class="doc-sech"><span class="idx">11</span>验收标准摘要</div><p class="doc-goal">{{ doc.sections[10].items[0] }} {{ doc.sections[10].items[1] || '' }}</p></div>
          <div class="doc-tip">点击 <el-icon><expand/></el-icon> 展开查看完整 12 要素（可编辑）</div>
        </template>
        <template v-else>
          <div class="doc-tools">
            <el-input v-model="kw" size="small" placeholder="搜索本文档关键词" prefix-icon="Search" clearable />
            <el-button size="small" link type="primary" @click="exportJson">导出JSON</el-button>
            <el-button size="small" link type="primary" @click="importJson">导入JSON</el-button>
            <el-button size="small" link @click="resetCur">恢复默认（本页）</el-button>
            <el-button size="small" link @click="resetAll">恢复默认（全部）</el-button>
            <input ref="fileEl" type="file" accept="application/json" style="display:none" @change="onFile"/>
          </div>
          <div v-for="s in view" :key="s.i" class="doc-sec">
            <div class="doc-sech"><span class="idx">{{ s.i + 1 }}</span>{{ s.t }}<a class="doc-add" title="新增条目" @click="addItem(s.i)"><el-icon><plus/></el-icon>新增</a></div>
            <div v-for="(it,ii) in s.items" :key="ii" class="doc-item">
              <div class="tx" v-html="hl(it)" @dblclick="editItem(s.i, ii)"></div>
              <span class="it-ops"><el-icon title="编辑" @click="editItem(s.i, ii)"><edit/></el-icon><el-icon title="删除" @click="delItem(s.i, ii)"><delete/></el-icon></span>
            </div>
          </div>
          <div v-if="!view.length" class="doc-empty">未找到匹配「{{ kw }}」的条目</div>
        </template>
      </div>
    </div>
  </div>`,
};

/* ===== 第 3 阶段：客户内部关系图（全局组件 RelationGraph，props: customer 客户名称） =====
   节点按态度着色（支持者/中立/反对者）、按影响力定大小；
   边类型：汇报（实线）/ 影响（虚线）/ 支持（实）/ 反对（虚红）/ 合作（长虚线）；
   自动派生（汇报对象 + 对决策人的态度/影响力）+ 自定义扩展边（本案新增的「影响/合作」等）；
   点击节点跳转该联系人详情；带图例；可编辑：修改态度 / 新增关系（真实写回 store.ext.contacts / 边扩展） */
const REL_ATT_COLOR = () => ({ 支持者: cssVar('--el-color-success') || '#67c23a', 中立: cssVar('--el-color-info') || '#909399', 反对者: cssVar('--el-color-danger') || '#f56c6c' });
const REL_EXTRA = reactive({});                     // 客户名 → [{ from, to, type }]（from/to 为联系人编号）
const RelationGraph = {
  props: { customer: String, current: String, editable: { type: Boolean, default: true }, height: { type: String, default: '340px' } },
  setup(props) {
    const contacts = computed(() => store.ext.contacts.filter(c => c.customer === props.customer));
    const dec = computed(() => contacts.value.find(c => c.role === '决策人') || null);
    const extra = computed(() => REL_EXTRA[props.customer] || []);
    /* ---- 自动边：汇报 / 支持 / 反对 / 合作（按 attitude 与影响力对决策人派生） ---- */
    const autoEdges = computed(() => {
      const d = dec.value; const out = [];
      contacts.value.forEach(c => {
        if (c.reportsTo && contacts.value.some(x => x.no === c.reportsTo)) out.push({ from: c.no, to: c.reportsTo, type: '汇报' });
        if (!d || c.no === d.no) return;
        if (c.attitude === '支持者') out.push({ from: c.no, to: d.no, type: '支持' });
        else if (c.attitude === '反对者') out.push({ from: c.no, to: d.no, type: '反对' });
        else if (c.infl === '高') out.push({ from: c.no, to: d.no, type: '影响' });
        else if (c.key) out.push({ from: c.no, to: d.no, type: '合作' });
      });
      return out;
    });
    const edges = computed(() => autoEdges.value.concat(extra.value.filter(e => e.from && e.to)));
    /* ---- 决策链：按汇报关系从决策人向下逐级 ---- */
    const chain = computed(() => {
      const cs = contacts.value; const kids = {};
      cs.forEach(c => kids[c.no] = []);
      cs.forEach(c => { if (c.reportsTo && kids[c.reportsTo]) kids[c.reportsTo].push(c); });
      const roots = dec.value ? [dec.value] : cs.filter(c => !c.reportsTo);
      const out = []; const walk = (list, lvl) => list.forEach(c => { out.push({ c, lvl }); walk(kids[c.no] || [], lvl + 1); });
      walk(roots, 0);
      return out;
    });
    const supporters = computed(() => contacts.value.filter(c => c.attitude === '支持者'));
    const opponents = computed(() => contacts.value.filter(c => c.attitude === '反对者'));
    /* ---- ECharts graph ---- */
    const el = ref(null); let chart = null;
    const sizeOf = infl => infl === '高' ? 46 : infl === '中' ? 34 : 24;
    const option = computed(() => {
      const col = REL_ATT_COLOR();
      const cats = [{ name: '支持者', itemStyle: { color: col.支持者 } }, { name: '中立', itemStyle: { color: col.中立 } }, { name: '反对者', itemStyle: { color: col.反对者 } }];
      const nameById = {}; contacts.value.forEach(c => nameById[c.no] = c.name);
      const edgeStyle = {
        汇报: { color: cssVar('--text') || '#666', width: 2.2 },
        影响: { color: col.中立, width: 1.6, type: [6, 3] },
        支持: { color: col.支持者, width: 2 },
        反对: { color: col.反对者, width: 2, type: 'dashed' },
        合作: { color: col.中立, width: 1.4, type: [10, 6] },
      };
      return {
        color: cats.map(c => c.itemStyle.color),
        tooltip: { formatter: p => p.dataType === 'node' ? p.data.name + '<br/>' + p.data.title + ' · ' + p.data.role + '<br/>态度：' + p.data.attitude + ' · 影响力：' + p.data.infl : nameById[p.data.source] + ' → ' + nameById[p.data.target] + '（' + p.data.rel + '）' },
        legend: { show: false },
        series: [{
          type: 'graph', layout: 'force', roam: true, categories: cats,
          data: contacts.value.map(c => ({ id: c.no, name: c.name, title: c.title, role: c.role, infl: c.infl, attitude: c.attitude, symbolSize: sizeOf(c.infl), category: c.attitude === '支持者' ? 0 : c.attitude === '反对者' ? 2 : 1, label: { show: true, fontSize: 11, formatter: '{b}' } })),
          links: edges.value.map(e => ({ source: e.from, target: e.to, rel: e.type, lineStyle: edgeStyle[e.type] || { width: 1.5 }, label: { show: true, formatter: e.type, fontSize: 9, color: cssVar('--sub') || '#999' } })),
          force: { repulsion: 300, edgeLength: [70, 150], gravity: 0.06 },
          edgeSymbol: ['none', 'arrow'], edgeSymbolSize: 7, lineStyle: { curveness: 0.08, opacity: 0.75 },
          emphasis: { focus: 'adjacency', label: { fontSize: 13, fontWeight: 'bold' } },
        }],
      };
    });
    const render = () => { if (chart && option.value) chart.setOption(option.value, true); chart && (chart.__disp = true); };
    onMounted(() => {
      if (!el.value || !window.echarts) return;
      chart = echarts.init(el.value, null, { renderer: 'canvas' });
      chart.on('click', p => { if (p.dataType === 'node' && p.data.id) go('/contact/' + p.data.id); });
      render();
      window.addEventListener('resize', () => chart && chart.resize());
    });
    watch(option, () => nextTick(render), { deep: true });
    watch(() => props.customer, () => nextTick(render));
    watch(theme, () => nextTick(render));
    /* ---- 小交互：修改态度 / 新增关系（写回数据） ---- */
    const dlg = reactive({ att: false, rel: false });
    const atf = reactive({ no: '', attitude: '支持者' });
    const rtf = reactive({ from: '', to: '', type: '影响' });
    const openAtt = () => { atf.no = props.current || (contacts.value[0] || {}).no || ''; atf.attitude = (contacts.value.find(c => c.no === atf.no) || {}).attitude || '中立'; dlg.att = true; };
    const doAtt = () => {
      const c = contacts.value.find(x => x.no === atf.no);
      if (!c) return ElMessage.warning('请选择联系人');
      c.attitude = atf.attitude;
      dlg.att = false; ElMessage.success('已修改「' + c.name + '」的态度为「' + atf.attitude + '」，关系图与名单已刷新');
    };
    const openRel = () => { const cs = contacts.value; rtf.from = props.current || (cs[0] || {}).no || ''; rtf.to = (cs.find(c => c.no !== rtf.from) || {}).no || ''; rtf.type = '影响'; dlg.rel = true; };
    const doRel = () => {
      if (!rtf.from || !rtf.to) return ElMessage.warning('请选择两个联系人');
      if (rtf.from === rtf.to) return ElMessage.warning('两个联系人不能相同');
      const a = contacts.value.find(x => x.no === rtf.from), b = contacts.value.find(x => x.no === rtf.to);

/* --- 字段规范：保留行用 sign/end，生成行用 startDate/endDate，统一补齐 --- */
store.ext.contracts.forEach(ct => { if (!ct.startDate) ct.startDate = ct.signDate || ''; if (!ct.endDate) ct.endDate = ct.end || ''; });

/* --- 合同状态流转定义与写日志工具 --- */
const CT_FLOW = [
  { from: '草稿', act: '提交审批', to: '审批中', tip: '提交后进入审批流程（销售经理 / 法务 / 财务）' },
  { from: '审批中', act: '审批通过', to: '已签署', tip: '（演示）模拟审批链全部同意后自动置为已签署' },
  { from: '已签署', act: '开始履约', to: '履约中', tip: '合同生效进入履约期，可开始回款与交付' },
  { from: '履约中', act: '完成履约', to: '已完成', tip: '款项与交付完成后归档' },
];
const ctLogTime = () => TODAY + ' 0' + ((store.ext.logs.length % 8) + 1) + ':' + ((store.ext.logs.length * 7 % 55) + 5);
function ctLog(no, act, detail) { store.ext.logs.unshift({ time: ctLogTime(), who: '张三', module: '合同', act, detail: detail + '（合同：' + no + '）' }); }
function ctTransit(ct, act) {
  const step = CT_FLOW.find(f => f.from === ct.status && f.act === act);
  if (!step) return false;
  ct.status = step.to;
  ctLog(ct.no, act, '状态由「' + step.from + '」变更为「' + step.to + '」');
  return true;
}
/* 新建合同付款条款模板（分期比例合计恒为 100%） */
const CT_PAY_TPLS = [
  { key: 'A', label: '合同签署 30% / 项目上线 40% / 项目验收 30%', stages: [['合同签署', 30], ['项目上线', 40], ['项目验收', 30]] },
  { key: 'B', label: '预付款 50% / 验收款 50%', stages: [['预付款', 50], ['验收款', 50]] },
  { key: 'C', label: '首付款 60% / 尾款 40%', stages: [['首付款', 60], ['尾款', 40]] },
];
/* 合同已收金额：优先取回款管理（store.pay）中该合同的核销记录，否则按计划状态折算 */
const ctRecvOf = (ct, plan) => {
  const fallback = plan.status === '已回款' ? plan.amount : plan.status === '部分回款' ? plan.amount / 2 : 0;
  const pc = (typeof store.pay !== 'undefined') && store.pay.contracts.find(x => x.no === ct.no);
  if (!pc || !plan.stage) return fallback;
  const got = store.pay.records.reduce((s, r) => s + r.alloc.filter(a => pc.plans.filter(p => p.stage === plan.stage).some(p => p.id === a.plan)).reduce((x, a) => x + a.amt, 0), 0);
  return Math.max(got / 100, fallback);
};

const ContractDetailPage = {

/* ===== 第 3 阶段：客户合并 /customers/merge（四步流程 + 合并记录，可从客户详情带入当前客户） ===== */
const MERGE_STATE = reactive({ from: '' });
const MERGE_FIELDS = [
  ['name', '客户名称'], ['type', '客户类型'], ['industry', '行业分类'], ['level', '客户等级'], ['source', '客户来源'],
  ['region', '所属区域'], ['scale', '客户规模'], ['owner', '客户负责人'], ['phone', '联系电话'], ['status', '客户状态'],
];
const CustomerMergePage = {
  components: { PageHead },
  setup() {
    const step = ref(1);
    const form = reactive({ main: '', merged: '', reason: '' });
    const keep = reactive({});
    const custNames = computed(() => store.customers.map(c => c.name));
    const mainC = computed(() => store.customers.find(c => c.name === form.main) || null);
    const subC = computed(() => store.customers.find(c => c.name === form.merged) || null);
    const fields = computed(() => MERGE_FIELDS.map(([k, l]) => ({
      k, l, mv: mainC.value ? String(mainC.value[k] ?? '-') : '', sv: subC.value ? String(subC.value[k] ?? '-') : '', same: mainC.value && subC.value && String(mainC.value[k] ?? '-') === String(subC.value[k] ?? '-'),
    })));
    const resetKeep = () => MERGE_FIELDS.forEach(([k]) => keep[k] = 'main');
    watch(() => [form.main, form.merged], resetKeep, { immediate: true });
    if (MERGE_STATE.from && store.customers.some(c => c.name === MERGE_STATE.from)) { const f0 = MERGE_STATE.from; MERGE_STATE.from = ''; form.merged = f0; }
    /* 迁移预览：联系人/商机/报价/合同/订单/跟进 数量 */
    const migRows = computed(() => {
      if (!subC.value) return [];
      const n = subC.value.name; const cnt = f => (f || []).filter(x => x.customer === n).length;
      return [
        { k: 'contact', l: '联系人', n: cnt(store.ext.contacts) }, { k: 'opp', l: '商机', n: cnt(store.opps) },
        { k: 'quote', l: '报价', n: cnt(store.ext.quotes) }, { k: 'contract', l: '合同', n: cnt(store.ext.contracts) },
        { k: 'order', l: '订单', n: cnt(store.ext.orders) }, { k: 'act', l: '跟进记录', n: cnt(store.ext.activities) },
      ];
    });
    const migTotal = computed(() => migRows.value.reduce((s, r) => s + r.n, 0));
    const pickCount = computed(() => MERGE_FIELDS.filter(([k]) => keep[k] === 'sub').length);
    const canNext = computed(() => {
      if (step.value === 1) return !!mainC.value && !!subC.value && form.main !== form.merged;
      return true;
    });
    const next = () => {
      if (step.value === 1 && !canNext.value) return ElMessage.warning('请选择主客户与被合并客户（两个客户不能相同）');
      if (step.value < 4) step.value++;
    };
    const prev = () => step.value > 1 && step.value--;
    /* ---- 合并记录 ---- */
    if (!store.ext.merges) store.ext.merges = [];
    /* ---- 提交合并 ---- */
    const doMerge = () => {
      if (!form.reason || !form.reason.trim()) return ElMessage.warning('请填写合并原因（必填）');
      const m = mainC.value, s = subC.value; if (!m || !s) return ElMessage.warning('请选择主客户与被合并客户');
      MERGE_FIELDS.forEach(([k]) => { if (keep[k] === 'sub') m[k] = s[k]; });     // 冲突字段按选择保留
      // 关联数据真实迁移：改归属到主客户
      const n = s.name;
      store.ext.contacts.forEach(x => { if (x.customer === n) x.customer = m.name; });
      store.opps.forEach(x => { if (x.customer === n) x.customer = m.name; });
      ['quotes', 'contracts', 'orders', 'activities'].forEach(k => store.ext[k].forEach(x => { if (x.customer === n) x.customer = m.name; }));
      s.status = '已合并'; s.mergedTo = m.no; s.mergedAt = TODAY;                 // 原编号保留，记录映射
      store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '客户', act: '客户合并', detail: `客户合并「${s.name}」（${s.no}）→「${m.name}」（${m.no}）；迁移 ${migTotal.value} 条关联数据；原因：${form.reason}` });
      store.ext.merges.unshift({ time: TODAY + ' 09:00', main: m.name, mainNo: m.no, sub: n, subNo: s.no, mig: migTotal.value, pick: pickCount.value, reason: form.reason, who: '张三', appr: m.key ? '审批中' : '已通过' });
      step.value = 1; form.main = ''; form.merged = ''; form.reason = ''; resetKeep();
      if (m.key) ElNotification({ title: '合并已完成（重点客户审批提示）', message: `「${n}」已合并入「${m.name}」，迁移 ${migTotal.value} 条关联数据。重点客户合并需补充「${m.owner}」的直属经理审批留痕，审批流程已生成。`, type: 'warning', duration: 6000 });
      else ElMessage.success(`客户合并完成：「${n}」已并入「${m.name}」，迁移 ${migTotal.value} 条关联数据，操作日志已记录`);
    };
    return { step, form, keep, fields, migRows, migTotal, pickCount, canNext, next, prev, doMerge, custNames, mainC, subC, resetKeep, store };
  },
  template: `<div>
    <el-breadcrumb separator="/" class="crumb"><el-breadcrumb-item><a @click="$go('/customers')">客户管理</a></el-breadcrumb-item><el-breadcrumb-item><a @click="$go('/customers')">客户列表</a></el-breadcrumb-item><el-breadcrumb-item>客户合并</el-breadcrumb-item></el-breadcrumb>
    <div class="page-head"><h1>客户合并</h1><span class="total" v-if="store.customers.length">当前可用客户 {{ store.customers.length }} 家</span></div>
    <el-alert type="warning" show-icon :closable="false" style="margin-bottom:14px" title="合并不可简单撤销：被合并客户将被置为「已合并」并保留原编号映射；关联数据（联系人/商机/报价/合同/订单/跟进）全部迁移至主客户。重点客户合并需走审批。"/>
    <div class="card card-pad">
      <el-steps :active="step - 1" align-center finish-status="success" style="margin-bottom:20px">
        <el-step title="选择客户" description="主客户 + 被合并客户"/><el-step title="字段冲突对比" description="逐字段选择保留值"/>
        <el-step title="迁移预览" description="关联数据归属变更"/><el-step title="确认提交" description="填写原因并提交"/>
      </el-steps>
      <div v-if="step===1">
        <el-form label-width="110px" style="max-width:640px;margin:6px auto 0">
          <el-form-item label="主客户" required><el-select v-model="form.main" filterable placeholder="搜索并选择保留的主档案" style="width:100%"><el-option v-for="n in custNames" :key="'m'+n" :label="n" :value="n"/></el-select></el-form-item>
          <el-form-item label="被合并客户" required><el-select v-model="form.merged" filterable :class="{'is-self':form.merged && form.merged===form.main}" placeholder="搜索并选择要并入的客户" style="width:100%"><el-option v-for="n in custNames.filter(n=>n!==form.main)" :key="'s'+n" :label="n" :value="n"/></el-select><div class="muted" style="font-size:12px;margin-top:4px">客户详情页「客户合并」会将当前客户自动带入该选择</div></el-form-item>
          <el-alert v-if="form.main && form.main===form.merged" type="error" :closable="false" show-icon :title="'主客户与被合并客户相同，请重新选择'"/>
        </el-form>
      </div>
      <div v-else-if="step===2">
        <div class="muted" style="margin:0 0 10px">逐字段选择合并后保留的值；相同字段无需选择。左侧为主客户 <b>{{ mainC ? mainC.name : '-' }}</b>，右侧为被合并客户 <b>{{ subC ? subC.name : '-' }}</b>。</div>
        <el-table :data="fields" border><el-table-column prop="l" label="字段" width="140"/>
          <el-table-column label="主客户值" min-width="200"><template #default="{row}">{{ row.mv }}</template></el-table-column>
          <el-table-column label="被合并客户值" min-width="200"><template #default="{row}">{{ row.sv }}</template></el-table-column>
          <el-table-column label="保留" width="200" align="center"><template #default="{row}">
            <span v-if="row.same" class="muted">相同</span>
            <el-radio-group v-else v-model="keep[row.k]" size="small"><el-radio-button label="main">保留主客户</el-radio-button><el-radio-button label="sub">保留被合并</el-radio-button></el-radio-group>
          </template></el-table-column></el-table>
        <div class="muted" style="margin-top:8px">已选择保留被合并客户值的字段：{{ pickCount }} 个</div>
      </div>
      <div v-else-if="step===3">
        <div class="muted" style="margin:0 0 10px">以下 <b>{{ subC ? subC.name : '' }}</b> 的关联数据将迁移到主客户 <b>{{ mainC ? mainC.name : '' }}</b> 名下（原编号与历史记录保留）。</div>
        <div class="stat-row" style="grid-template-columns:repeat(6,1fr);margin-bottom:14px">
          <div class="stat-card" v-for="r in migRows" :key="r.k"><span class="lb">{{ r.l }}</span><span class="vl">{{ r.n }}</span><span class="ft">{{ r.n ? '将迁移' : '无数据' }}</span></div>
        </div>
        <el-alert :type="migTotal ? 'info' : 'success'" show-icon :closable="false" :title="migTotal ? ('合计迁移 ' + migTotal + ' 条关联数据的 customer 归属字段改写为「' + (mainC ? mainC.name : '') + '」') : '被合并客户暂无关联数据，仅做档案合并'"/>
      </div>
      <div v-else>
        <el-form label-width="110px" style="max-width:700px">
          <el-form-item label="合并摘要"><el-descriptions :column="2" border size="small" style="width:100%">
            <el-descriptions-item label="主客户">{{ mainC ? mainC.name + '（' + mainC.no + '）' : '-' }}</el-descriptions-item>
            <el-descriptions-item label="被合并客户">{{ subC ? subC.name + '（' + subC.no + '）' : '-' }}<el-tag v-if="subC && subC.no" size="small" effect="plain" style="margin-left:6px">原编号映射保留</el-tag></el-descriptions-item>
            <el-descriptions-item label="迁移关联数据">{{ migTotal }} 条</el-descriptions-item>
            <el-descriptions-item label="字段保留：被合并值"> {{ pickCount }} 个字段</el-descriptions-item>
          </el-descriptions></el-form-item>

/* ===== 第 3 阶段：产品目录 /products + 产品详情 /product/:no + 价格表 /pricebooks ===== */
const PRODUCT_CATS = ['软件', '服务', '实施费用', '维护费用', '增值服务', '套餐'];
const PRODUCT_STS = ['在售', '停售', '停用'];
const PRODUCT_STATUS_TAG = { 在售: 'success', 停售: 'warning', 停用: 'info' };
const genProductNo = () => {
  let seq = store.ext.products.length + 100; let no;
  do { no = 'CP-' + String(seq++).padStart(4, '0'); } while (store.ext.products.some(p => p.no === no));
  return no;
};

/* ----- 产品目录（真写入 store.ext.products） ----- */
const ProductsPage = {
  components: { ListPage },
  setup() {
    const rows = computed(() => store.ext.products);
    const stats = computed(() => {
      const a = store.ext.products;
      return [['产品总数', String(a.length), '', PRODUCT_CATS.length + ' 个分类'], ['在售', String(a.filter(p => p.status === '在售').length), 'ok'], ['停售 / 停用', String(a.filter(p => p.status !== '在售').length), 'warn'], ['价格表', String(store.ext.pricebooks.length), '']];
    });
    const cols = [
      { p: 'no', l: '产品编号', w: 110 }, { p: 'name', l: '产品名称', w: 200, link: true }, { p: 'cat', l: '产品分类', w: 100 },
      { p: 'spec', l: '产品规格', w: 150 }, { p: 'unit', l: '标准单位', w: 95 }, { p: 'price', l: '标准售价', w: 115, money: true },
      { p: 'cost', l: '成本价', w: 110, money: true }, { p: 'status', l: '产品状态', w: 95, tag: PRODUCT_STATUS_TAG }, { p: 'desc', l: '产品说明', w: 220 },
    ];
    const filters = [
      { k: 'kw', label: '搜索产品', ph: '产品编号 / 名称 / 说明' }, { k: 'cat', label: '产品分类', opts: PRODUCT_CATS }, { k: 'status', label: '产品状态', opts: PRODUCT_STS },
    ];
    /* ---- 新增 / 编辑 / 停售 ---- */
    const fref = ref(null);
    const dlg = reactive({ open: false, edit: null });
    const f = reactive({});
    const rule = {
      name: [{ required: true, message: '请填写产品名称', trigger: 'blur' }],
      cat: [{ required: true, message: '请选择产品分类', trigger: 'change' }],
      price: [{ required: true, message: '请填写标准售价', trigger: 'blur' }, { type: 'number', min: 0.01, message: '售价必须大于 0', trigger: 'blur' }],
      cost: [{ type: 'number', min: 0, message: '成本价不能为负数', trigger: 'blur' }],
    };
    const openAdd = () => { dlg.edit = null; Object.assign(f, { no: '', name: '', cat: '软件', spec: '', unit: '套', price: null, cost: null, status: '在售', desc: '' }); dlg.open = true; nextTick(() => fref.value && fref.value.clearValidate()); };
    const openEdit = row => { dlg.edit = store.ext.products.find(x => x.no === row.no) || row; Object.keys(f).forEach(k => delete f[k]); Object.assign(f, dlg.edit); dlg.open = true; nextTick(() => fref.value && fref.value.clearValidate()); };
    const save = () => fref.value.validate(ok => {
      if (!ok) return;
      const data = { name: f.name, cat: f.cat, spec: f.spec, unit: f.unit, price: f.price, cost: f.cost || 0, status: f.status, desc: f.desc };
      if (dlg.edit) { Object.assign(dlg.edit, data); store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '编辑', detail: `编辑产品「${f.name}」（${dlg.edit.no}）` }); ElMessage.success('产品已保存，目录与价格表明细即时同步'); }
      else {
        const no = genProductNo(); const p = { no, ...data };
        store.ext.products.push(p);
        store.ext.pricebooks.forEach(b => b.items.push({ productNo: no, price: data.price, minDiscount: b.type === '渠道价' ? 80 : 85 }));
        store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '新建', detail: `新建产品「${f.name}」（${no}），已同步到全部价格表` });
        ElMessage.success('产品已新增并同步到全部价格表');
      }
      dlg.open = false;
    });
    const toggleSale = row => {
      const goOut = row.status === '在售';
      ElMessageBox.confirm(`确认将产品「${row.name}」${goOut ? '停售' : '恢复在售'}？${goOut ? '停售后不能再加入新报价，历史报价不受影响。' : '恢复后可正常用于报价。'}`, goOut ? '停售确认' : '恢复在售', { type: 'warning' }).then(() => {
        row.status = goOut ? '停售' : '在售';
        store.ext.logs.unshift({ time: TODAY + ' 09:00', who: '张三', module: '系统', act: '编辑', detail: `产品「${row.name}」（${row.no}）状态变更为：${row.status}` });
        ElMessage.success(`已${goOut ? '停售' : '恢复在售'}：${row.name}`);
      }).catch(() => {});
    };
    return { rows, stats, cols, filters, dlg, f, fref, rule, openAdd, openEdit, save, toggleSale, PRODUCT_CATS, PRODUCT_STS, store, fmtY, fmtC };
  },
  template: `<div>
    <list-page :crumbs="['产品管理','产品目录']" title="产品目录" :stats="stats" :filters="filters" :rows="rows" :cols="cols" :action-width="170"
      @link="(c,row) => $go('/product/'+row.no)">
      <template #ops><el-button type="primary" icon="Plus" @click="openAdd">新增产品</el-button><el-button icon="Tickets" @click="$go('/pricebooks')">价格表管理</el-button><el-button icon="Upload" @click="$msg.info('示例：导入产品')">导入</el-button></template>
      <template #actions="{row,open}">
        <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
        <el-button link type="primary" @click="$go('/product/'+row.no)">详情</el-button>
        <el-button v-if="row.status==='在售'" link type="danger" @click="toggleSale(row)">停售</el-button>
        <el-button v-else link type="success" @click="toggleSale(row)">恢复</el-button>
      </template>
    </list-page>
    <el-dialog v-model="dlg.open" :title="dlg.edit ? '编辑产品 · ' + (dlg.edit.name||'') : '新增产品'" width="560px">
      <el-form ref="fref" :model="f" :rules="rule" label-width="96px">
        <el-form-item label="产品名称" prop="name"><el-input v-model="f.name"/></el-form-item>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="产品分类" prop="cat"><el-select v-model="f.cat" style="width:100%"><el-option v-for="x in PRODUCT_CATS" :key="x" :label="x" :value="x"/></el-select></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="产品状态"><el-select v-model="f.status" style="width:100%"><el-option v-for="x in PRODUCT_STS" :key="x" :label="x" :value="x"/></el-select></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="产品规格"><el-input v-model="f.spec" placeholder="如 50 用户 · 年付"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="标准单位"><el-input v-model="f.unit" placeholder="如 套 / 人天 / 年"/></el-form-item></el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12"><el-form-item label="标准售价" prop="price"><el-input-number v-model="f.price" :min="0.01" :step="100" :controls="false" style="width:100%" placeholder="元"/></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="成本价" prop="cost"><el-input-number v-model="f.cost" :min="0" :step="100" :controls="false" style="width:100%" placeholder="元"/></el-form-item></el-col>
        </el-row>
        <el-form-item label="产品说明"><el-input type="textarea" :rows="2" v-model="f.desc"/></el-form-item>
      </el-form>
      <el-alert type="info" show-icon :closable="false" :title="'保存后写入产品目录；新增产品会自动同步到全部 ' + store.ext.pricebooks.length + ' 张价格表'"/>
      <template #footer><el-button @click="dlg.open=false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
    </el-dialog>
  </div>`,
};
registerRoute('/products', ProductsPage, 'products');

/* ----- 产品详情：各价格表价格 + 引用产品的报价 ----- */
const ProductDetail = {
  components: { PageHead },
  props: { no: String },
  setup(props) {
    const p = computed(() => store.ext.products.find(x => x.no === props.no) || null);
    const bookRows = computed(() => !p.value ? [] : store.ext.pricebooks.map(b => {
      const it = b.items.find(i => i.productNo === p.value.no) || {};
      return { no: b.no, name: b.name, type: b.type, status: b.status, price: it.price == null ? (p.value.price || 0) : it.price, minDiscount: it.minDiscount == null ? 85 : it.minDiscount, ratio: p.value.price ? Math.round(it.price * 100 / p.value.price) : 100 };
    }));
    const quoteRows = computed(() => !p.value ? [] : store.ext.quotes.filter(q => (q.items || []).some(it => it.productNo === props.no)).map(q => {
      const it = (q.items || []).find(x => x.productNo === props.no);
      return { no: q.no, customer: q.customer, date: q.date, appr: q.appr, qty: it.qty, unit: it.unit, price: it.price, discount: it.discount };
    }));
    const QuoteTag = { 已通过: 'success', 审批中: 'warning', 草稿: 'info', 已驳回: 'danger' };
    return { p, bookRows, quoteRows, QuoteTag, PRODUCT_STATUS_TAG, fmtY, fmtC, store };
  },
  template: `<div v-if="p">
    <el-breadcrumb separator="/" class="crumb"><el-breadcrumb-item><a @click="$go('/products')">产品管理</a></el-breadcrumb-item><el-breadcrumb-item><a @click="$go('/products')">产品目录</a></el-breadcrumb-item><el-breadcrumb-item>{{ p.name }}</el-breadcrumb-item></el-breadcrumb>

      { v: 'V2', date: '2026-10-30 15:10', by: '张三', total: 34465000, disc: 1680000, st: '已发送客户 · 客户要求调整', note: '未含移动端扩展包', cur: false },

      { k: 'owner', label: '负责人', opts: owners.value },
    ]);
    /* ---- 新建报价弹窗 ---- */
    const fref = ref(null);
    const dlg = ref(false); const itemDlg = ref(false);
    const items = ref([]);
    const draft = reactive({ customer: '', opp: '', owner: '张三', date: TODAY, appr: '草稿' });
    const rule = {
      customer: [{ required: true, message: '请选择客户', trigger: 'change' }],
      owner: [{ required: true, message: '请选择负责人', trigger: 'change' }],
    };
    const addProduct = reactive({ no: '', qty: 1, discount: 90 });
    const addProductRow = () => {
      if (!addProduct.no) return ElMessage.warning('请选择产品');
      const p = store.ext.products.find(x => x.no === addProduct.no);
      if (!p) return;
      if (items.value.some(it => it.productNo === p.no)) return ElMessage.warning('该产品已在明细中，请直接调整数量与折扣');
      items.value.push({ productNo: p.no, name: p.name, qty: addProduct.qty, unit: p.unit, price: p.price, discount: addProduct.discount });
      addProduct.no = '';
    };
    const delProductRow = i => items.value.splice(i, 1);
    const money = computed(() => {
      let orig = 0, sub = 0;
      items.value.forEach(it => { orig += it.price * it.qty; sub += Math.round(it.price * it.qty * it.discount / 100); });
      return { orig, sub, amount: Math.round(sub * 1.13 * 100) / 100, disc: Math.round((orig - sub) * 100) / 100 };
    });
    const oppOptions = computed(() => store.opps.filter(o => !draft.customer || o.customer === draft.customer));
    const save = () => fref.value.validate(ok => {
      if (!ok) return;
      if (!items.value.length) return ElMessage.warning('请至少添加一条报价明细');
      const already = new Set(store.ext.quotes.map(q => q.no));
      const base = 'BJ-' + TODAY.slice(0, 7).replace('-', '') + '-';
      let seqS = 100 + store.ext.quotes.filter(q => q.no.startsWith(base)).length;
      let no; do { no = base + String(seqS++).padStart(4, '0'); } while (already.has(no));
      store.ext.quotes.unshift({ no, customer: draft.customer, opp: draft.opp, amount: money.value.amount, disc: money.value.disc, date: draft.date, valid: extAddDays(draft.date, 30), owner: draft.owner, appr: draft.appr, ver: 'V1', items: JSON.parse(JSON.stringify(items.value)) });

      Object.assign(t, { amount: ed.amount, disc: ed.disc, appr: ed.appr, owner: ed.owner, date: ed.date, valid: ed.valid });

      edDlg.value = false; ElMessage.success('报价已更新');
    };
    return { totalText, stats, cols, filters, store, fref, dlg, items, draft, rule, addProduct, addProductRow, delProductRow, money, oppOptions, save, edDlg, ed, openEdit, saveEd, OWNERS, fmtC, fmtY };

registerRoute('/workbench', WorkbenchPage, 'workbench');

const App = {
  components: { DocPanel },
  setup() {
    const parse = () => { const h = (location.hash || '#/workbench').slice(1); return h || '/workbench'; };
    const path = ref(parse());
    window.addEventListener('hashchange', () => { path.value = parse(); document.querySelector('.main') && (document.querySelector('.main').scrollTop = 0); });
    const view = computed(() => {
      const m = matchRoute(path.value);
      if (m) return { comp: m.comp, props: m.props, docKey: m.docKey };
      return { comp: NotFoundPage, props: {}, docKey: '' };
    });
    watch(view, v => { docState.key = v.docKey; docState.override = ''; }, { immediate: true });
    const active = computed(() => {
      const p = path.value;
      if (p.startsWith('/customer/')) return '/customers';
      if (p.startsWith('/quote/')) return '/quotes';
      if (p.startsWith('/lead/')) return '/leads/my';
      if (p.startsWith('/opp/')) return '/opps/list';
      return p;
    });
    const menu = ref(null);
    const opened = computed(() => { const n = NAV.find(n => n.children && n.children.some(c => c.path === active.value)); return n ? [n.key] : []; });
    watch(opened, v => { v.length && menu.value && menu.value.open(v[0]); });
    // 全局搜索
    const kw = ref('');
    const searchFn = (q, cb) => {
      if (!q) return cb([]);
      const r = [];
      store.customers.forEach(c => { if (c.name.includes(q) || c.no.includes(q)) r.push({ value: c.name, tag: '客户', to: '/customer/' + c.no }); });
      store.leads.forEach(l => { if (l.company.includes(q) || l.no.includes(q) || l.contact.includes(q)) r.push({ value: l.company + '（' + l.no + '）', tag: '线索', to: '/lead/' + l.no }); });
      store.opps.forEach(o => { if (o.name.includes(q) || o.no.includes(q)) r.push({ value: o.name, tag: '商机', to: '/opp/' + o.no }); });
      PH.contacts.rows.forEach(c => { if (c.name.includes(q)) r.push({ value: c.name + ' · ' + c.customer, tag: '联系人', to: '/contacts' }); });
      cb(r.slice(0, 8));
    };
    const selectSearch = it => { go(it.to); kw.value = ''; };
    const unread = computed(() => store.messages.filter(m => !m.read).length);
    const todoCount = computed(() => store.approvals.filter(a => a.tab === 'todo').length + 8);
    const readAll = () => store.messages.forEach(m => m.read = true);
    return { path, view, active, menu, opened, NAV, kw, searchFn, selectSearch, unread, todoCount, store, go, readAll, THEMES, theme, applyTheme };
  },
  template: `<div class="layout">
    <div class="topbar">
      <div class="brand"><div class="logo">C</div>CRM 客户管理系统</div>
      <el-autocomplete v-model="kw" class="top-search" :fetch-suggestions="searchFn" placeholder="全局搜索：客户 / 线索 / 商机 / 联系人" prefix-icon="Search" clearable @select="selectSearch" :trigger-on-focus="false">
        <template #default="{item}"><el-tag size="small" effect="plain" style="margin-right:8px">{{ item.tag }}</el-tag>{{ item.value }}</template></el-autocomplete>
      <div class="top-right">
        <el-button size="small" plain icon="Iphone" @click="go('/mobile')">移动端预览</el-button>
        <el-dropdown trigger="click" @command="applyTheme">
          <div class="icon-btn" title="主题切换"><el-icon><brush/></el-icon></div>
          <template #dropdown><el-dropdown-menu>
            <el-dropdown-item v-for="t in THEMES" :key="t[0]" :command="t[0]">
              <span class="theme-dot" :style="{background:t[2]}"></span>{{ t[1] }}
              <el-icon v-if="theme === t[0]" style="margin-left:auto;color:var(--el-color-primary)"><check/></el-icon>
            </el-dropdown-item>
          </el-dropdown-menu></template>
        </el-dropdown>
        <el-popover placement="bottom-end" :width="360" trigger="click">
          <template #reference><div class="icon-btn" title="消息通知"><el-icon><bell/></el-icon><el-badge :value="unread" :hidden="!unread"/></div></template>
          <div style="display:flex;align-items:center;margin-bottom:6px"><b>消息通知</b><a style="margin-left:auto;font-size:13px" @click="readAll">全部已读</a></div>
          <div class="msg" :class="{read:m.read}" v-for="m in store.messages" :key="m.id" @click="m.read=true"><span class="u" :class="{read:m.read}"></span><div><div>{{ m.title }}</div><div class="muted" style="font-size:12px">{{ m.type }} · {{ m.time }}</div></div></div>
        </el-popover>
        <div class="icon-btn" title="待办 / 审批" @click="go('/approvals')"><el-icon><finished/></el-icon><el-badge :value="todoCount" type="warning"/></div>
        <el-dropdown trigger="click"><div class="user-chip"><div class="avatar">张</div><div style="line-height:1.2"><div style="font-size:13px;font-weight:600">张三</div><div style="font-size:11px;color:var(--sub)">销售经理</div></div><el-icon><arrow-down/></el-icon></div>
          <template #dropdown><el-dropdown-menu><el-dropdown-item>个人设置</el-dropdown-item><el-dropdown-item>切换数据范围</el-dropdown-item><el-dropdown-item divided>退出登录</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
      </div>
    </div>
    <div class="body">
      <div class="sidebar">
        <el-menu ref="menu" :default-active="active" :default-openeds="opened" unique-opened @select="p => go(p)">
          <template v-for="n in NAV" :key="n.key">
            <el-sub-menu v-if="n.children" :index="n.key"><template #title><el-icon><component :is="n.icon"/></el-icon><span>{{ n.title }}</span></template>
              <el-menu-item v-for="c in n.children" :key="c.path" :index="c.path">{{ c.title }}</el-menu-item></el-sub-menu>
            <el-menu-item v-else :index="n.path"><el-icon><component :is="n.icon"/></el-icon><span>{{ n.title }}</span></el-menu-item>
          </template>
        </el-menu>
      </div>
      <div class="main"><component :is="view.comp" :key="path" v-bind="view.props"/></div>
      <doc-panel/>
    </div>
  </div>`,
};

app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
