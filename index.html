<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业级 CRM 系统 · 高保真原型</title>
<link rel="stylesheet" href="lib/element-plus.css">
<style>
:root{
  --el-color-primary:#1f4e9c;
  --el-color-primary-light-3:#6b8fc9;
  --el-color-primary-light-5:#9ab3dc;
  --el-color-primary-light-7:#c9d6ec;
  --el-color-primary-light-8:#dbe4f3;
  --el-color-primary-light-9:#eaf0f9;
  --el-color-primary-dark-2:#18407f;
  --navy:#0b1f3f; --navy2:#12305c; --bg:#f2f5fa; --line:#e6eaf1; --text:#1d2a3d; --sub:#6b778c;
  --el-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--el-font-family);font-size:14px}
#app{height:100%}
a{color:var(--el-color-primary);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.layout{display:flex;flex-direction:column;height:100vh;min-width:1200px}
.topbar{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px 0 0;gap:16px;z-index:10}
.brand{width:220px;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:600;font-size:16px;letter-spacing:.5px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3d7be0,#1f4e9c);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.top-search{width:360px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#4a5872;font-size:19px;position:relative}
.icon-btn:hover{background:var(--el-color-primary-light-9);color:var(--el-color-primary)}
.icon-btn .el-badge{position:absolute;top:2px;right:0}
.user-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:8px;margin-left:6px}
.user-chip:hover{background:var(--el-color-primary-light-9)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--el-color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:220px;flex:none;background:var(--navy);overflow-y:auto;padding-bottom:12px}
.sidebar::-webkit-scrollbar{width:0}
.sidebar .el-menu{background:transparent;border-right:0}
.sidebar .el-menu-item,.sidebar .el-sub-menu__title{height:40px;line-height:40px;color:#b9c6dd;font-size:14px}
.sidebar .el-menu-item:hover,.sidebar .el-sub-menu__title:hover{background:#12305c;color:#fff}
.sidebar .el-menu-item.is-active{background:var(--el-color-primary);color:#fff}
.sidebar .el-sub-menu.is-active>.el-sub-menu__title{color:#fff}
.sidebar .el-sub-menu .el-menu{background:#081832}
.sidebar .el-sub-menu .el-menu-item{height:36px;line-height:36px;padding-left:52px!important;font-size:13px}
.sidebar .el-icon{color:inherit}
.main{flex:1;overflow:auto;padding:16px 24px 28px;min-width:0}
.crumb{margin-bottom:8px}
.page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.page-head h1{margin:0;font-size:20px;font-weight:600;white-space:nowrap}
.page-head .total{color:var(--sub);font-size:14px}
.page-head .head-ops{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:10px}
.card-pad{padding:16px 18px}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-title .more{margin-left:auto;font-weight:400;font-size:13px}
.stat-row{display:grid;gap:14px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.stat-card .lb{color:var(--sub);font-size:13px}
.stat-card .vl{font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-card .ft{color:var(--sub);font-size:12px}
.stat-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--el-color-primary)}
.stat-card.warn:before{background:#e6a23c}.stat-card.danger:before{background:#d9534f}.stat-card.ok:before{background:#2e9e6a}
.stat-card.danger .vl{color:#c0392b}
.query{padding:14px 16px 2px;margin-bottom:12px}
.query .el-form-item{margin-bottom:12px;margin-right:14px}
.ops{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ops .grow{margin-left:auto;color:var(--sub);font-size:13px}
.table-card{padding:6px 6px 0}
.table-card .el-table{--el-table-header-bg-color:#f6f8fc;--el-table-header-text-color:#475672}
.table-card .el-table th.el-table__cell{font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 10px}
.pager .batch{color:var(--sub);font-size:13px}
.link{color:var(--el-color-primary);cursor:pointer}
.link:hover{text-decoration:underline}
.mono{font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--sub)}
.danger-text{color:#c0392b}
.ok-text{color:#2e9e6a}
.row-actions .el-button+.el-button{margin-left:6px}
/* workbench */
.wb-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.wb-hello{background:linear-gradient(120deg,#0f2d5c,#1f4e9c 70%,#2d6bc4);color:#fff;border-radius:10px;padding:18px 24px;display:flex;align-items:center;margin-bottom:14px}
.wb-hello h2{margin:0 0 4px;font-size:20px;font-weight:600}
.wb-hello .d{opacity:.8;font-size:13px}
.wb-hello .seg{margin-left:auto;display:flex;gap:28px}
.wb-hello .seg div{text-align:center}.wb-hello .seg b{display:block;font-size:22px}.wb-hello .seg span{font-size:12px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick .q{border:1px solid var(--line);border-radius:10px;padding:12px 4px;text-align:center;cursor:pointer;background:#fafbfd;transition:.15s}
.quick .q:hover{border-color:var(--el-color-primary);background:var(--el-color-primary-light-9)}
.quick .q .el-icon{font-size:22px;color:var(--el-color-primary);margin-bottom:6px}
.quick .q div{font-size:13px}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.todo-item:hover{background:var(--el-color-primary-light-9)}
.todo-item .dot{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.todo-item .n{margin-left:auto;font-weight:600;font-size:16px}
.todo-item .n small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.tl-line{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.tl-line:last-child{border-bottom:0}
.tl-line .t{width:92px;flex:none;color:var(--el-color-primary);font-weight:600;font-variant-numeric:tabular-nums}
.sch{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.sch .tm{width:46px;font-weight:600;font-variant-numeric:tabular-nums}
.sch .bar{width:3px;border-radius:2px;align-self:stretch;background:var(--el-color-primary)}
.msg{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.msg:last-child{border-bottom:0}
.msg .u{width:7px;height:7px;border-radius:50%;background:#d9534f;margin-top:7px;flex:none}
.msg .u.read{background:transparent}
.msg.read{color:var(--sub)}
.perf-num{display:flex;gap:26px;margin:4px 0 10px}
.perf-num b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.perf-num span{font-size:12px;color:var(--sub)}
/* detail */
.cust-head{padding:18px 22px;display:flex;gap:18px;align-items:center;margin-bottom:14px}
.cust-logo{width:56px;height:56px;border-radius:12px;background:var(--el-color-primary-light-8);color:var(--el-color-primary);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.cust-head h2{margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:8px}
.cust-meta{display:flex;gap:22px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.cust-meta b{color:var(--text);font-weight:500}
.sum-cards{display:flex;gap:12px;margin-left:auto}
.sum-card{border:1px solid var(--line);border-radius:10px;padding:10px 18px;min-width:116px;text-align:center;background:#fafbfd}
.sum-card .v{font-size:22px;font-weight:600;color:var(--el-color-primary);font-variant-numeric:tabular-nums}
.sum-card .l{font-size:12px;color:var(--sub)}
.detail-tabs .el-tabs__header{margin-bottom:0}
.tab-body{padding:16px 6px 6px}
.tl-item-card{background:#f8fafd;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:2px}
.sec-title{font-weight:600;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:before{content:"";width:3px;height:14px;background:var(--el-color-primary);border-radius:2px}
.org-tree .el-tree-node__content{height:34px}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(176px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:#e9eef7;border-radius:10px;padding:10px;min-height:560px;border:2px solid transparent}
.kcol.over{border-color:var(--el-color-primary);background:#dfe8f6}
.kcol-h{display:flex;align-items:center;gap:6px;padding:2px 4px 8px}
.kcol-h b{font-size:14px}
.kcol-h .cnt{background:#fff;border-radius:10px;padding:0 8px;font-size:12px;color:var(--el-color-primary);font-weight:600}
.kcol-sum{font-size:12px;color:var(--sub);padding:0 4px 8px;border-bottom:1px solid #d5dded;margin-bottom:10px}
.kcard{background:#fff;border-radius:8px;padding:10px 10px;margin-bottom:10px;cursor:grab;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,40,80,.05)}
.kcard:hover{box-shadow:0 4px 12px rgba(15,40,80,.12);border-color:var(--el-color-primary-light-5)}
.kcard .nm{font-weight:600;margin-bottom:4px;line-height:1.4}
.kcard .cu{font-size:12px;color:var(--sub);margin-bottom:8px}
.kcard .am{font-size:16px;font-weight:600;color:var(--el-color-primary);font-variant-numeric:tabular-nums}
.kcard .ft{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);margin-top:8px;white-space:nowrap}
.kcard .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.kcard .ft .adv{margin-left:auto}
.kmore{text-align:center;font-size:12px;color:var(--sub);padding:6px}
.gate-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fafbfd}
.gate-row.bad{border-color:#f1b0a8;background:#fff5f3}
.gate-row .st{width:20px;flex:none;margin-top:4px}
.stage-flow{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px}
/* quote */
.amt-box{margin-left:auto;width:360px;border:1px solid var(--line);border-radius:10px;padding:12px 18px;background:#fafbfd}
.amt-box .r{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.amt-box .r.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-size:18px;font-weight:700;color:var(--el-color-primary)}
.flow{display:flex;align-items:flex-start;gap:0;padding:6px 0 4px}
.fnode{display:flex;flex-direction:column;align-items:center;min-width:132px;text-align:center;position:relative}
.fnode .c{width:30px;height:30px;border-radius:50%;background:#e4e9f2;color:#7a869c;display:flex;align-items:center;justify-content:center;font-weight:600;z-index:1;border:2px solid #e4e9f2}
.fnode.done .c{background:#2e9e6a;border-color:#2e9e6a;color:#fff}
.fnode.cur .c{background:#fff;border-color:var(--el-color-primary);color:var(--el-color-primary);box-shadow:0 0 0 4px rgba(31,78,156,.15)}
.fnode.rej .c{background:#d9534f;border-color:#d9534f;color:#fff}
.fnode .nm{margin-top:6px;font-size:13px;font-weight:600}.fnode .pp{font-size:12px;color:var(--sub)}
.fline{flex:1;min-width:28px;height:2px;background:#e4e9f2;margin-top:15px}
.fline.done{background:#2e9e6a}
.appr-wrap{display:grid;grid-template-columns:480px minmax(0,1fr);gap:14px;align-items:start}
.appr-item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px;border-left:3px solid transparent}
.appr-item:hover{background:#f5f8fd}
.appr-item.active{background:var(--el-color-primary-light-9);border-left-color:var(--el-color-primary)}
.appr-item .tt{font-weight:600;display:flex;gap:8px;align-items:center}
.appr-item .tt .el-tag{margin-left:auto}
.appr-item .sm{font-size:12px;color:var(--sub);display:flex;gap:12px}
.opinion{padding:10px 14px;background:#f8fafd;border-radius:8px;border:1px solid var(--line);margin-bottom:8px}
/* mobile preview */
.mob-wrap{display:flex;gap:48px;justify-content:center;align-items:flex-start;padding:10px 0}
.phone{width:370px;height:730px;border-radius:46px;background:#111;padding:12px;box-shadow:0 20px 50px rgba(15,40,80,.3),inset 0 0 0 2px #333;flex:none}
.screen{width:100%;height:100%;border-radius:36px;background:#f3f6fb;overflow:hidden;display:flex;flex-direction:column;position:relative}
.m-status{height:34px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font-size:12px;font-weight:600;background:transparent}
.m-notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:96px;height:22px;background:#111;border-radius:12px}
.m-body{flex:1;overflow-y:auto;padding:0 14px 14px}
.m-body::-webkit-scrollbar{width:0}
.m-hero{background:linear-gradient(135deg,#12305c,#1f4e9c);color:#fff;border-radius:16px;padding:16px;margin:4px 0 12px}
.m-hero h3{margin:0 0 4px;font-size:18px}
.m-hero p{margin:0;font-size:12px;opacity:.85}
.m-stats{display:flex;gap:10px;margin-top:14px}
.m-stats div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px;text-align:center}
.m-stats b{font-size:24px;display:block}.m-stats span{font-size:12px;opacity:.85}
.m-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.m-card h4{margin:0 0 12px;font-size:15px}
.m-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.m-quick .qi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.m-quick .qi i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:normal}
.m-todo{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f6;align-items:center}
.m-todo:last-child{border-bottom:0}
.m-todo .tm{font-weight:700;color:var(--el-color-primary);width:48px;font-variant-numeric:tabular-nums}
.m-tabbar{height:64px;background:#fff;display:flex;border-top:1px solid #e8ecf3;padding-bottom:6px}
.m-tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#8a95a8;cursor:pointer}
.m-tabbar div .el-icon{font-size:22px}
.m-tabbar div.on{color:var(--el-color-primary);font-weight:600}
.m-list-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eef1f6;align-items:center}
.m-list-item:last-child{border-bottom:0}
.m-ava{width:38px;height:38px;border-radius:10px;background:var(--el-color-primary-light-8);color:var(--el-color-primary);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mob-side{max-width:440px}
.mob-side h3{margin:0 0 10px}
.mob-side table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}
.mob-side td,.mob-side th{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left}
.mob-side th{background:#f6f8fc}
.ph-note{margin-bottom:12px}
.el-drawer__header{margin-bottom:12px!important;font-weight:600;color:var(--text)}
.drawer-sec{margin-bottom:18px}
.dup-tag{cursor:pointer}
.el-table .row-overdue td.el-table__cell{background:#fff6f5!important}
.left-num .el-input__inner{text-align:left!important}

</style>
</head>
<body>
<div id="app"></div>
<script src="lib/vue.global.prod.js"></script>
<script src="lib/element-plus.min.js"></script>
<script src="lib/zh-cn.min.js"></script>
<script src="lib/icons.min.js"></script>
<script src="lib/echarts.min.js"></script>
<script>
/* ===== 工具函数 ===== */
const toC = n => Math.round(n * 100);                       // 元 → 分（金额一律用整数分计算，避免浮点误差）
const fmtC = c => (c / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtY = n => Number(n).toLocaleString('zh-CN');
const yuan = n => '¥' + fmtY(n);
const wan = n => '¥' + (n / 10000).toLocaleString('zh-CN', { maximumFractionDigits: 1 }) + '万';
const TODAY = '2026-11-02';
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ===== 导航（方案 4.1 的 15 个一级模块） ===== */
const NAV = [
  { key: 'workbench', title: '工作台', icon: 'HomeFilled', children: [
    { path: '/workbench', title: '个人工作台' }, { path: '/approvals', title: '审批中心' }, { path: '/mobile', title: '移动端预览' } ] },
  { key: 'leads', title: '线索管理', icon: 'Aim', children: [
    { path: '/leads', title: '线索列表' }, { path: '/leads/my', title: '我的线索' }, { path: '/leads/pool', title: '线索公海' }, { path: '/leads/records', title: '线索转化记录' } ] },
  { key: 'customers', title: '客户管理', icon: 'OfficeBuilding', children: [
    { path: '/customers', title: '客户列表' }, { path: '/customers/my', title: '我的客户' }, { path: '/customers/pool', title: '客户公海' }, { path: '/customers/key', title: '重点客户' } ] },
  { key: 'contacts', title: '联系人管理', icon: 'User', path: '/contacts' },
  { key: 'opps', title: '商机管理', icon: 'TrendCharts', children: [
    { path: '/opps', title: '商机看板' }, { path: '/opps/list', title: '商机列表' } ] },
  { key: 'products', title: '产品管理', icon: 'Goods', path: '/products' },
  { key: 'quotes', title: '报价管理', icon: 'Tickets', children: [
    { path: '/quotes', title: '报价列表' }, { path: '/quote/BJ-202611-0008', title: '报价单详情' } ] },
  { key: 'contracts', title: '合同管理', icon: 'Document', path: '/contracts' },
  { key: 'orders', title: '订单管理', icon: 'ShoppingCart', path: '/orders' },
  { key: 'payments', title: '回款管理', icon: 'Wallet', path: '/payments' },
  { key: 'activities', title: '活动管理', icon: 'Calendar', path: '/activities' },
  { key: 'delivery', title: '交付管理', icon: 'Box', path: '/delivery' },
  { key: 'service', title: '服务管理', icon: 'Headset', path: '/service' },
  { key: 'analytics', title: '数据分析', icon: 'DataAnalysis', path: '/analytics' },
  { key: 'system', title: '系统管理', icon: 'Setting', path: '/system' },
];

/* ===== 消息 / 待办 ===== */
const MESSAGES = [
  { id: 1, title: '线索 XS-202611-0008 已分配给你', time: '今天 09:12', type: '分配通知', read: false },
  { id: 2, title: '报价 BJ-202611-0008 (V3) 折扣审批待处理', time: '今天 08:40', type: '审批提醒', read: false },
  { id: 3, title: '回款计划「项目上线」已逾期 5 天', time: '今天 08:00', type: '逾期提醒', read: false },
  { id: 4, title: '合同 HT-202607-0004 将于 12 天后到期', time: '昨天 17:30', type: '到期提醒', read: true },
  { id: 5, title: '你提交的客户转移申请已通过', time: '11-01 15:20', type: '审批结果', read: true },
];

const TAX_RATE_BP = 1300; // 13.00%（基点）
const DISCOUNT_RULES = [
  { max: 500, role: '销售人员（授权范围内，自动通过）' }, { max: 1000, role: '销售经理' }, { max: 2000, role: '销售总监' }, { max: 10001, role: '总经理 / 财务负责人（低于价格底线）' } ];
function calcQuote(items) {
  let orig = 0, sub = 0;
  const rows = items.map(it => {
    const stdC = toC(it.price);
    const dealC = Math.round(stdC * it.disc / 100);           // 成交单价（分）
    const lineOrig = stdC * it.qty, lineSub = dealC * it.qty;
    orig += lineOrig; sub += lineSub;
    return { ...it, stdC, dealC, lineSub };
  });
  const discount = orig - sub;
  const tax = Math.round(sub * TAX_RATE_BP / 10000);
  const discBp = orig ? Math.round(discount * 10000 / orig) : 0;
  const rule = DISCOUNT_RULES.find(r => discBp <= r.max);
  return { rows, orig, sub, discount, tax, total: sub + tax, discBp, rule };
}

const EChart = {
  props: { option: Object, height: { type: String, default: '260px' } },
  setup(props) {
    const el = ref(null); let chart = null;
    const render = () => { if (chart && props.option) chart.setOption(props.option, true); };
    onMounted(() => {
      chart = echarts.init(el.value, null, { renderer: 'canvas' }); render();
      window.addEventListener('resize', resize);
    });
    const resize = () => chart && chart.resize();
    onBeforeUnmount(() => { window.removeEventListener('resize', resize); chart && chart.dispose(); });
    watch(() => props.option, render, { deep: true });
    return { el };
  },
  template: `<div ref="el" :style="{width:'100%',height:height}"></div>`,
};

const OppsPage = {
  components: { PageHead },
  props: { view: { type: String, default: 'board' } },
  setup(props) {
    const owner = ref(''); const kw = ref('');
    const cards = computed(() => store.opps.filter(o => (!owner.value || o.owner === owner.value) && (!kw.value || (o.name + o.customer + o.no).includes(kw.value))));
    const base = JSON.parse(JSON.stringify(OPPS_INIT));
    const colCards = key => cards.value.filter(o => o.stage === key);
    const initial = key => base.filter(o => o.stage === key);
    const colCount = key => STAGES.find(s => s.key === key).total + (store.opps.filter(o => o.stage === key).length - initial(key).length);
    const colAmount = key => STAGES.find(s => s.key === key).amount + store.opps.filter(o => o.stage === key).reduce((s, o) => s + o.amount, 0) - initial(key).reduce((s, o) => s + o.amount, 0);
    const totalOpen = computed(() => STAGES.slice(0, 5).reduce((s, st) => s + colCount(st.key), 0));
    const totalAmt = computed(() => STAGES.slice(0, 5).reduce((s, st) => s + colAmount(st.key), 0));
    const stalled = computed(() => store.opps.filter(o => o.flags && o.flags.stalled).length);
    // ---- 拖拽 ----
    const dragNo = ref(''); const overKey = ref('');
    const onDrop = key => { overKey.value = ''; const o = store.opps.find(x => x.no === dragNo.value); if (o) request(o, key); };
    // ---- 阶段推进校验 ----
    const gate = reactive({ show: false, opp: null, target: '', mode: 'win', form: {}, errors: {}, failed: false, remark: '' });
    const nextStage = o => STAGES[STAGE_IDX[o.stage] + 1];
    const request = (o, key) => {
      const cur = STAGE_IDX[o.stage], tgt = STAGE_IDX[key];
      if (cur === tgt) return;
      if (o.stage === 'close') return ElMessage.warning('该商机已结束并归档，不能再推进');
      if (tgt < cur) return ElMessage.warning('暂不支持直接回退阶段；如需回退请提交「阶段回退」申请并填写原因');
      if (tgt - cur > 1) return ElMessage.error(`禁止跳阶段：「${o.name}」当前处于「${STAGES[cur].name}」，下一阶段应为「${STAGES[cur + 1].name}」`);
      Object.assign(gate, { show: true, opp: o, target: key, mode: 'win', form: JSON.parse(JSON.stringify(o.info || {})), errors: {}, failed: false, remark: '' });
    };
    const rule = computed(() => gate.target === 'close' ? STAGE_RULES[gate.mode] : STAGE_RULES[gate.target]);
    const sysOk = chk => !!(gate.opp && gate.opp.flags && gate.opp.flags[chk.k]);
    const confirmMove = () => {
      const r = rule.value; const errs = {}; let bad = false;
      (r.fields || []).forEach(f => { if (!gate.form[f.k] && !(f.k === 'competitor')) errs[f.k] = '必填'; });
      (r.checks || []).forEach(c => { if (!sysOk(c)) { errs[c.k] = '未满足'; bad = true; } });
      gate.errors = errs; gate.failed = Object.keys(errs).length > 0;
      if (gate.failed) return ElMessage.error('不满足进入条件，无法推进，请补全必填项');
      const o = gate.opp; const from = STAGES[STAGE_IDX[o.stage]].name;
      o.info = { ...o.info, ...gate.form };
      if (gate.target === 'close') { o.result = gate.mode === 'win' ? '赢单' : '输单'; o.prob = gate.mode === 'win' ? 100 : 0; if (gate.mode === 'lose') o.loseReason = gate.form.loseReason; }
      else o.prob = STAGES[STAGE_IDX[gate.target]].prob;
      o.stage = gate.target; o.history = (o.history || []).concat([{ from, to: gate.target === 'close' ? o.result : STAGES[STAGE_IDX[gate.target]].name, by: '张三', time: '2026-11-02 07:00', remark: gate.remark || '-' }]);
      gate.show = false; ElMessage.success(`阶段已变更：${from} → ${gate.target === 'close' ? o.result : STAGES[STAGE_IDX[gate.target]].name}，变更记录已保留`);
    };
    const drawer = ref(false); const cur = ref(null);
    const openCard = o => { cur.value = o; drawer.value = true; };
    const stageName = k => (STAGES.find(s => s.key === k) || {}).name;
    const stageTagType = o => o.stage === 'close' ? (o.result === '赢单' ? 'success' : 'danger') : 'primary';
    const listRows = computed(() => cards.value);
    return { owner, kw, cards, colCards, colCount, colAmount, totalOpen, totalAmt, stalled, dragNo, overKey, onDrop, gate, nextStage, request, rule, sysOk, confirmMove, drawer, cur, openCard, stageName, stageTagType, listRows, STAGES, OWNERS, fmtY, yuan, wan, go, view: computed(() => props.view), STAGE_IDX };
  },

    </div>

const PaymentsPage = {

  setup() {
    const tab = ref('plan');

    const recvOf = (planId) => store.pay.records.reduce((s, r) => s + r.alloc.filter(a => a.plan === planId).reduce((x, a) => x + a.amt, 0), 0);
    const lastDate = (planId) => { const ds = store.pay.records.filter(r => r.alloc.some(a => a.plan === planId)).map(r => r.date).sort(); return ds.length ? ds[ds.length - 1] : '-'; };
    const confirmOf = (planId) => { const rs = store.pay.records.filter(r => r.alloc.some(a => a.plan === planId)); if (!rs.length) return '-'; return rs.every(r => r.confirm === '财务已确认') ? '财务已确认' : '待财务复核'; };
    const planRows = computed(() => {
      const out = [];
      store.pay.contracts.forEach(ct => ct.plans.forEach((p, i) => {
        const got = recvOf(p.id); const rest = p.amount - got; const due = p.date <= TODAY;
        const overdue = rest > 0 && p.date < TODAY; const days = overdue ? daysBetween(p.date, TODAY) : 0;
        const status = got >= p.amount ? '已核销' : overdue ? (got > 0 ? '部分核销 · 逾期' : '逾期未收') : got > 0 ? '部分核销' : '未到期';
        out.push({ no: 'HK-' + p.id.replace('P', '').padStart(4, '0'), ct, contract: ct.no, customer: ct.customer, order: ct.order, stage: p.stage, ratio: p.ratio, date: p.date, plan: p.amount, got, rest, due, overdue, days, status, last: lastDate(p.id), confirm: confirmOf(p.id), owner: ct.owner, pid: p.id, seq: i + 1 });
      }));
      return out;
    });

const App = {
  components: { WorkbenchPage, LeadsPage, CustomersPage, CustomerDetail, OppsPage, QuotePage, PaymentsPage, ApprovalsPage, MobilePage, PlaceholderPage },
  setup() {
    const parse = () => { const h = (location.hash || '#/workbench').slice(1); return h || '/workbench'; };
    const path = ref(parse());
    window.addEventListener('hashchange', () => { path.value = parse(); document.querySelector('.main') && (document.querySelector('.main').scrollTop = 0); });
    const view = computed(() => {
      const p = path.value; const seg = p.split('/').filter(Boolean);
      const [a, b] = seg;
      switch (a) {
        case 'workbench': return { c: 'WorkbenchPage', props: {} };
        case 'leads': return { c: 'LeadsPage', props: { tab: b || 'all' } };
        case 'customers': return { c: 'CustomersPage', props: { tab: b || 'all' } };
        case 'customer': return { c: 'CustomerDetail', props: { no: b, key: b } };
        case 'opps': return { c: 'OppsPage', props: { view: b === 'list' ? 'list' : 'board' } };
        case 'quote': return { c: 'QuotePage', props: { no: b, key: b } };
        case 'payments': return { c: 'PaymentsPage', props: {} };
        case 'approvals': return { c: 'ApprovalsPage', props: {} };
        case 'mobile': return { c: 'MobilePage', props: {} };
        default: return PH[a] ? { c: 'PlaceholderPage', props: { k: a } } : { c: 'WorkbenchPage', props: {} };
      }
    });
    const active = computed(() => { const p = path.value; if (p.startsWith('/customer/')) return '/customers'; if (p === '/quote/BJ-202611-0008') return p; if (p.startsWith('/quote/')) return '/quotes'; return p; });
    const menu = ref(null);
    const opened = computed(() => { const n = NAV.find(n => n.children && n.children.some(c => c.path === active.value)); return n ? [n.key] : []; });
    watch(opened, v => { v.length && menu.value && menu.value.open(v[0]); });
    // 全局搜索
    const kw = ref('');
    const searchFn = (q, cb) => {
      if (!q) return cb([]);
      const r = [];
      store.customers.forEach(c => { if (c.name.includes(q) || c.no.includes(q)) r.push({ value: c.name, tag: '客户', to: '/customer/' + c.no }); });
      store.leads.forEach(l => { if (l.company.includes(q) || l.no.includes(q) || l.contact.includes(q)) r.push({ value: l.company + '（' + l.no + '）', tag: '线索', to: '/leads' }); });
      store.opps.forEach(o => { if (o.name.includes(q) || o.no.includes(q)) r.push({ value: o.name, tag: '商机', to: '/opps' }); });
      PH.contacts.rows.forEach(c => { if (c.name.includes(q)) r.push({ value: c.name + ' · ' + c.customer, tag: '联系人', to: '/contacts' }); });
      cb(r.slice(0, 8));
    };
    const selectSearch = it => { go(it.to); kw.value = ''; };
    const unread = computed(() => store.messages.filter(m => !m.read).length);
    const todoCount = computed(() => store.approvals.filter(a => a.tab === 'todo').length + 8);
    const readAll = () => store.messages.forEach(m => m.read = true);
    return { path, view, active, menu, opened, NAV, kw, searchFn, selectSearch, unread, todoCount, store, go, readAll };
  },
  template: `<div class="layout">
    <div class="topbar">
      <div class="brand"><div class="logo">C</div>CRM 客户管理系统</div>
      <el-autocomplete v-model="kw" class="top-search" :fetch-suggestions="searchFn" placeholder="全局搜索：客户 / 线索 / 商机 / 联系人" prefix-icon="Search" clearable @select="selectSearch" :trigger-on-focus="false">
        <template #default="{item}"><el-tag size="small" effect="plain" style="margin-right:8px">{{ item.tag }}</el-tag>{{ item.value }}</template></el-autocomplete>
      <div class="top-right">
        <el-button size="small" plain icon="Iphone" @click="go('/mobile')">移动端预览</el-button>
        <el-popover placement="bottom-end" :width="360" trigger="click">
          <template #reference><div class="icon-btn" title="消息通知"><el-icon><bell/></el-icon><el-badge :value="unread" :hidden="!unread"/></div></template>
          <div style="display:flex;align-items:center;margin-bottom:6px"><b>消息通知</b><a style="margin-left:auto;font-size:13px" @click="readAll">全部已读</a></div>
          <div class="msg" :class="{read:m.read}" v-for="m in store.messages" :key="m.id" @click="m.read=true"><span class="u" :class="{read:m.read}"></span><div><div>{{ m.title }}</div><div class="muted" style="font-size:12px">{{ m.type }} · {{ m.time }}</div></div></div>
        </el-popover>
        <div class="icon-btn" title="待办 / 审批" @click="go('/approvals')"><el-icon><finished/></el-icon><el-badge :value="todoCount" type="warning"/></div>
        <el-dropdown trigger="click"><div class="user-chip"><div class="avatar">张</div><div style="line-height:1.2"><div style="font-size:13px;font-weight:600">张三</div><div style="font-size:11px;color:#8a95a8">销售经理</div></div><el-icon><arrow-down/></el-icon></div>
          <template #dropdown><el-dropdown-menu><el-dropdown-item>个人设置</el-dropdown-item><el-dropdown-item>切换数据范围</el-dropdown-item><el-dropdown-item divided>退出登录</el-dropdown-item></el-dropdown-menu></template></el-dropdown>
      </div>
    </div>
    <div class="body">
      <div class="sidebar">
        <el-menu ref="menu" :default-active="active" :default-openeds="opened" unique-opened @select="p => go(p)">
          <template v-for="n in NAV" :key="n.key">
            <el-sub-menu v-if="n.children" :index="n.key"><template #title><el-icon><component :is="n.icon"/></el-icon><span>{{ n.title }}</span></template>
              <el-menu-item v-for="c in n.children" :key="c.path" :index="c.path">{{ c.title }}</el-menu-item></el-sub-menu>
            <el-menu-item v-else :index="n.path"><el-icon><component :is="n.icon"/></el-icon><span>{{ n.title }}</span></el-menu-item>
          </template>
        </el-menu>
      </div>
      <div class="main"><component :is="view.c" v-bind="view.props"/></div>
    </div>
  </div>`,
};
const app = Vue.createApp(App);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
Object.entries(ElementPlusIconsVue).forEach(([k, v]) => app.component(k, v));
Object.assign(app.config.globalProperties, { $go: go, $msg: ElMessage, $cno: cno, $yuan: yuan, $fmtY: fmtY, $fmtC: fmtC });
app.mount('#app');

</script>
</body>
